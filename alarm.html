<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>告警中心</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #0a1929;
            color: #ffffff;
            overflow-x: hidden;
            margin: 0 auto;
            padding: 20px;
        }

        .page-header {
            background-color: #10253b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .page-header h1 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #909399;
            padding: 8px 16px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background-color: #18304a;
            color: #ffffff;
        }

        .nav-links a.active {
            background-color: #18304a;
            color: #409eff;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background-color: #10253b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .stat-title {
            color: #909399;
            font-size: 14px;
        }

        .stat-card.warning .stat-number {
            color: #faad14;
        }

        .stat-card.danger .stat-number {
            color: #f5222d;
        }

        .stat-card.success .stat-number {
            color: #52c41a;
        }

        .stat-card.info .stat-number {
            color: #1890ff;
        }

        .filter-section {
            background-color: #10253b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-group label {
            font-weight: 500;
            color: #909399;
        }

        .filter-group select,
        .filter-group input {
            padding: 8px 12px;
            border: 1px solid #18304a;
            border-radius: 4px;
            font-size: 14px;
            background-color: #0a1929;
            color: #ffffff;
        }

        .filter-group button {
            padding: 8px 16px;
            background-color: #1890ff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-group button:hover {
            background-color: #40a9ff;
        }

        .alarm-list {
            background-color: #10253b;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .alarm-header {
            padding: 16px 20px;
            background-color: #18304a;
            border-bottom: 1px solid #2a435c;
            font-weight: 500;
            display: grid;
            grid-template-columns: 80px 120px 1fr 100px 100px 100px 120px;
            gap: 20px;
            align-items: center;
            color: #909399;
        }

        .alarm-item {
            padding: 16px 20px;
            border-bottom: 1px solid #18304a;
            display: grid;
            grid-template-columns: 80px 120px 1fr 100px 100px 100px 120px;
            gap: 20px;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .alarm-item:hover {
            background-color: #18304a;
        }

        .alarm-item:last-child {
            border-bottom: none;
        }

        .alarm-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            text-align: center;
        }

        .alarm-status.pending {
            background-color: rgba(250, 140, 22, 0.1);
            color: #fa8c16;
        }

        .alarm-status.processing {
            background-color: rgba(24, 144, 255, 0.1);
            color: #1890ff;
        }

        .alarm-status.resolved {
            background-color: rgba(82, 196, 26, 0.1);
            color: #52c41a;
        }

        .alarm-status.closed {
            background-color: rgba(144, 147, 153, 0.1);
            color: #909399;
        }

        .alarm-level {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            text-align: center;
        }

        .alarm-level.high {
            background-color: rgba(245, 34, 45, 0.1);
            color: #f5222d;
        }

        .alarm-level.medium {
            background-color: rgba(250, 140, 22, 0.1);
            color: #fa8c16;
        }

        .alarm-level.low {
            background-color: rgba(82, 196, 26, 0.1);
            color: #52c41a;
        }

        .process-btn {
            padding: 6px 12px;
            background-color: #1890ff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .process-btn:hover {
            background-color: #40a9ff;
        }

        .detail-btn {
            padding: 6px 12px;
            background-color: #52c41a;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .detail-btn:hover {
            background-color: #73d13d;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
        }

        .modal-content {
            background-color: #10253b;
            margin: 5% auto;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            color: #ffffff;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #18304a;
        }

        .modal-header h2 {
            font-size: 20px;
            color: #ffffff;
        }

        .close-btn {
            font-size: 24px;
            cursor: pointer;
            color: #909399;
        }

        .close-btn:hover {
            color: #ffffff;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section h3 {
            font-size: 16px;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .detail-item {
            display: flex;
            margin-bottom: 10px;
        }

        .detail-label {
            width: 120px;
            font-weight: 500;
            color: #909399;
        }

        .detail-value {
            flex: 1;
            color: #ffffff;
        }

        .process-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #18304a;
        }

        .process-section textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid #18304a;
            border-radius: 4px;
            resize: vertical;
            font-size: 14px;
            margin-bottom: 10px;
            background-color: #0a1929;
            color: #ffffff;
        }

        .process-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .process-actions button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .resolve-btn {
            background-color: #52c41a;
            color: #fff;
        }

        .resolve-btn:hover {
            background-color: #73d13d;
        }

        .reject-btn {
            background-color: #f5222d;
            color: #fff;
        }

        .reject-btn:hover {
            background-color: #ff4d4f;
        }

        .cancel-btn {
            background-color: #18304a;
            color: #909399;
        }

        .cancel-btn:hover {
            background-color: #2a435c;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .nav-links {
                flex-direction: column;
            }

            .stats-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .filter-section {
                flex-direction: column;
                align-items: stretch;
            }

            .alarm-header {
                display: none;
            }

            .alarm-item {
                grid-template-columns: 1fr;
                gap: 10px;
                padding: 12px;
            }

            .alarm-item > div {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .alarm-item > div > span:first-child {
                font-weight: 500;
                color: #666;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>告警中心</h1>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="dashboard.html">仪表盘</a>
                <a href="device.html">设备管理</a>
                <a href="events.html">事件中心</a>
                <a href="judge.html">集中判图</a>
                <a href="alarm.html" class="active">告警中心</a>
                <a href="analysis.html">统计分析</a>
                <a href="passage.html">通行管理</a>
                <a href="face.html">人脸识别</a>
                <a href="config.html">系统配置</a>
            </div>
        </div>

        <div class="stats-container">
            <div class="stat-card warning">
                <div class="stat-number" id="totalAlarms">0</div>
                <div class="stat-title">今日告警总数</div>
            </div>
            <div class="stat-card danger">
                <div class="stat-number" id="highLevel">0</div>
                <div class="stat-title">高级别告警</div>
            </div>
            <div class="stat-card info">
                <div class="stat-number" id="pendingAlarms">0</div>
                <div class="stat-title">待处理告警</div>
            </div>
            <div class="stat-card success">
                <div class="stat-number" id="resolvedAlarms">0</div>
                <div class="stat-title">已处理告警</div>
            </div>
        </div>

        <div class="filter-section">
            <div class="filter-group">
                <label for="alarmType">告警类型：</label>
                <select id="alarmType">
                    <option value="">全部</option>
                    <option value="intrusion">入侵告警</option>
                    <option value="fire">火灾告警</option>
                    <option value="device">设备告警</option>
                    <option value="access">门禁告警</option>
                    <option value="temperature">温度异常</option>
                    <option value="humidity">湿度异常</option>
                    <option value="network">网络异常</option>
                    <option value="power">电源异常</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="alarmLevel">告警级别：</label>
                <select id="alarmLevel">
                    <option value="">全部</option>
                    <option value="high">高级别</option>
                    <option value="medium">中级别</option>
                    <option value="low">低级别</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="alarmStatus">告警状态：</label>
                <select id="alarmStatus">
                    <option value="">全部</option>
                    <option value="pending">待处理</option>
                    <option value="processing">处理中</option>
                    <option value="resolved">已解决</option>
                    <option value="closed">已关闭</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="disposable">处理类型：</label>
                <select id="disposable">
                    <option value="">全部</option>
                    <option value="true">需要处置</option>
                    <option value="false">仅需查看</option>
                </select>
            </div>
            <div class="filter-group">
                <input type="text" id="searchInput" placeholder="搜索告警...">
                <button id="searchBtn">搜索</button>
            </div>
            <div class="filter-group">
                <button id="resetBtn">重置</button>
            </div>
        </div>

        <div class="alarm-list">
            <div class="alarm-header">
                <div>告警状态</div>
                <div>告警级别</div>
                <div>告警信息</div>
                <div>告警时间</div>
                <div>设备名称</div>
                <div>处理类型</div>
                <div>操作</div>
            </div>
            <div id="alarmListContent">
                <!-- 告警列表将通过JavaScript动态生成 -->
            </div>
            <!-- 分页控制 -->
            <div class="pagination-controls" style="margin-top: 0; padding: 15px 20px; background-color: #18304a; border-radius: 0 0 8px 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
                <div style="display: flex; align-items: center;">
                    <label for="alarmPageSizeSelect" style="color: #909399; margin-right: 8px;">每页显示:</label>
                    <select id="alarmPageSizeSelect" onchange="changeAlarmPageSize()" style="padding: 4px 8px; background-color: #0a1929; border: 1px solid #1e3a5f; color: #ffffff; border-radius: 4px; font-size: 12px;">
                        <option value="10">10条</option>
                        <option value="20" selected>20条</option>
                        <option value="30">30条</option>
                        <option value="50">50条</option>
                    </select>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button class="action-btn btn-secondary" onclick="goToAlarmPage(1)" id="alarmFirstPageBtn" style="padding: 4px 8px; font-size: 12px;">首页</button>
                    <button class="action-btn btn-secondary" onclick="goToAlarmPage(window.alarmCurrentPage - 1)" id="alarmPrevPageBtn" style="padding: 4px 8px; font-size: 12px;">上一页</button>
                    <span style="color: #ffffff;">第 <span id="alarmCurrentPageSpan">1</span>/<span id="alarmTotalPagesSpan">1</span> 页</span>
                    <button class="action-btn btn-secondary" onclick="goToAlarmPage(window.alarmCurrentPage + 1)" id="alarmNextPageBtn" style="padding: 4px 8px; font-size: 12px;">下一页</button>
                    <button class="action-btn btn-secondary" onclick="goToAlarmPage(window.alarmTotalPages)" id="alarmLastPageBtn" style="padding: 4px 8px; font-size: 12px;">末页</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 告警详情模态框 -->
    <div id="alarmDetailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>告警详情</h2>
                <span class="close-btn">&times;</span>
            </div>
            <div id="alarmDetailContent">
                <!-- 告警详情将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <script>
        // 模拟数据生成函数
        function generateMockData() {
            const alarmTypes = [
                { id: 'intrusion', name: '入侵告警', description: '检测到可疑人员入侵', isDisposable: true },
                { id: 'fire', name: '火灾告警', description: '检测到烟雾或火焰', isDisposable: true },
                { id: 'device', name: '设备告警', description: '设备故障或异常', isDisposable: true },
                { id: 'access', name: '门禁告警', description: '门禁系统异常', isDisposable: true },
                { id: 'temperature', name: '温度异常', description: '温度超出正常范围', isDisposable: false },
                { id: 'humidity', name: '湿度异常', description: '湿度超出正常范围', isDisposable: false },
                { id: 'network', name: '网络异常', description: '网络连接不稳定', isDisposable: false },
                { id: 'power', name: '电源异常', description: '电源电压不稳定', isDisposable: false }
            ];

            const alarmLevels = ['high', 'medium', 'low'];
            const alarmStatuses = ['pending', 'processing', 'resolved', 'closed'];
            const devices = ['摄像头-001', '摄像头-002', '烟感探测器-001', '门禁-001', '温湿度传感器-001', '电源监控器-001', '网络监控器-001'];
            const locations = ['一楼大厅', '二楼走廊', '地下车库', '机房', '办公室', '配电室'];

            const alarms = [];
            const now = new Date();

            for (let i = 0; i < 50; i++) {
                const type = alarmTypes[Math.floor(Math.random() * alarmTypes.length)];
                const level = alarmLevels[Math.floor(Math.random() * alarmLevels.length)];
                // 对于不需要处置的事件，默认状态为已查看
                const status = type.isDisposable ? alarmStatuses[Math.floor(Math.random() * alarmStatuses.length)] : 'resolved';
                const device = devices[Math.floor(Math.random() * devices.length)];
                const location = locations[Math.floor(Math.random() * locations.length)];
                
                // 随机生成过去24小时内的时间
                const timeOffset = Math.floor(Math.random() * 24 * 60 * 60 * 1000);
                const alarmTime = new Date(now.getTime() - timeOffset);

                alarms.push({
                    id: `alarm-${i + 1}`,
                    type: type.id,
                    typeName: type.name,
                    description: type.description + ` - ${location}`,
                    level: level,
                    levelName: level === 'high' ? '高级别' : level === 'medium' ? '中级别' : '低级别',
                    status: status,
                    statusName: status === 'pending' ? '待处理' : status === 'processing' ? '处理中' : status === 'resolved' ? '已解决' : '已关闭',
                    isDisposable: type.isDisposable,
                    isDisposableName: type.isDisposable ? '需要处置' : '仅需查看',
                    device: device,
                    location: location,
                    time: alarmTime.toLocaleString('zh-CN'),
                    processTime: status === 'resolved' || status === 'closed' ? new Date(alarmTime.getTime() + Math.floor(Math.random() * 3600000)).toLocaleString('zh-CN') : '',
                    processor: status === 'resolved' || status === 'closed' ? `处理人${Math.floor(Math.random() * 10) + 1}` : '',
                    processResult: status === 'resolved' ? (type.isDisposable ? '告警已处理，无异常' : '已查看，无需处置') : status === 'closed' ? '误报，已关闭' : ''
                });
            }

            return alarms;
        }

        // 页面数据
        let allAlarms = [];
        let filteredAlarms = [];
        
        // 分页变量
        window.alarmCurrentPage = 1;
        window.alarmPageSize = 20;
        window.alarmTotalPages = 1;

        // 初始化页面
        function initPage() {
            // 生成模拟数据
            allAlarms = generateMockData();
            filteredAlarms = [...allAlarms];

            // 渲染统计数据
            renderStats();

            // 初始化分页
            calculateAlarmTotalPages();
            renderPagedAlarmList();
            updateAlarmPaginationUI();

            // 绑定事件
            bindEvents();
        }

        // 渲染统计数据
        function renderStats() {
            const today = new Date().toDateString();
            const totalAlarms = allAlarms.filter(alarm => new Date(alarm.time).toDateString() === today).length;
            const highLevel = allAlarms.filter(alarm => alarm.level === 'high' && new Date(alarm.time).toDateString() === today).length;
            const pendingAlarms = allAlarms.filter(alarm => alarm.status === 'pending' && new Date(alarm.time).toDateString() === today).length;
            const resolvedAlarms = allAlarms.filter(alarm => alarm.status === 'resolved' && new Date(alarm.time).toDateString() === today).length;

            document.getElementById('totalAlarms').textContent = totalAlarms;
            document.getElementById('highLevel').textContent = highLevel;
            document.getElementById('pendingAlarms').textContent = pendingAlarms;
            document.getElementById('resolvedAlarms').textContent = resolvedAlarms;
        }

        // 渲染告警列表
        function renderAlarmList(alarmsToRender) {
            const container = document.getElementById('alarmListContent');
            container.innerHTML = '';

            if (alarmsToRender.length === 0) {
                container.innerHTML = '<div style="padding: 40px; text-align: center; color: #999;">没有找到匹配的告警记录</div>';
                return;
            }

            alarmsToRender.forEach(alarm => {
                const item = document.createElement('div');
                item.className = 'alarm-item';
                item.innerHTML = `
                    <div><span class="alarm-status ${alarm.status}">${alarm.statusName}</span></div>
                    <div><span class="alarm-level ${alarm.level}">${alarm.levelName}</span></div>
                    <div>
                        <div style="font-weight: 500;">${alarm.typeName}</div>
                        <div style="font-size: 12px; color: #666;">${alarm.description}</div>
                    </div>
                    <div>${alarm.time}</div>
                    <div>${alarm.device}</div>
                    <div><span style="color: ${alarm.isDisposable ? '#f5222d' : '#1890ff'}">${alarm.isDisposableName}</span></div>
                    <div>
                        ${alarm.status === 'pending' && alarm.isDisposable ? `<button class="process-btn" onclick="processAlarm('${alarm.id}')">处理</button>` : ''}
                        <button class="detail-btn" onclick="viewAlarmDetail('${alarm.id}')">详情</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // 计算告警总页数
        function calculateAlarmTotalPages() {
            window.alarmTotalPages = Math.ceil(filteredAlarms.length / window.alarmPageSize);
            if (window.alarmTotalPages < 1) {
                window.alarmTotalPages = 1;
            }
        }

        // 渲染分页告警列表
        function renderPagedAlarmList() {
            const startIndex = (window.alarmCurrentPage - 1) * window.alarmPageSize;
            const endIndex = startIndex + window.alarmPageSize;
            const pagedData = filteredAlarms.slice(startIndex, endIndex);
            
            renderAlarmList(pagedData);
        }

        // 更新分页UI
        function updateAlarmPaginationUI() {
            document.getElementById('alarmCurrentPageSpan').textContent = window.alarmCurrentPage;
            document.getElementById('alarmTotalPagesSpan').textContent = window.alarmTotalPages;
            
            // 更新按钮状态
            document.getElementById('alarmFirstPageBtn').disabled = window.alarmCurrentPage === 1;
            document.getElementById('alarmPrevPageBtn').disabled = window.alarmCurrentPage === 1;
            document.getElementById('alarmNextPageBtn').disabled = window.alarmCurrentPage === window.alarmTotalPages;
            document.getElementById('alarmLastPageBtn').disabled = window.alarmCurrentPage === window.alarmTotalPages;
        }

        // 跳转到指定告警页码
        function goToAlarmPage(pageNumber) {
            if (pageNumber < 1 || pageNumber > window.alarmTotalPages) {
                return;
            }
            
            window.alarmCurrentPage = pageNumber;
            renderPagedAlarmList();
            updateAlarmPaginationUI();
        }

        // 改变每页显示数量
        function changeAlarmPageSize() {
            const selectElement = document.getElementById('alarmPageSizeSelect');
            window.alarmPageSize = parseInt(selectElement.value);
            window.alarmCurrentPage = 1;
            
            calculateAlarmTotalPages();
            renderPagedAlarmList();
            updateAlarmPaginationUI();
        }

        // 查看告警详情
        function viewAlarmDetail(alarmId) {
            const alarm = allAlarms.find(a => a.id === alarmId);
            if (!alarm) return;

            const modal = document.getElementById('alarmDetailModal');
            const content = document.getElementById('alarmDetailContent');

            content.innerHTML = `
                <div class="detail-section">
                    <h3>基本信息</h3>
                    <div class="detail-item">
                        <div class="detail-label">告警ID：</div>
                        <div class="detail-value">${alarm.id}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">告警类型：</div>
                        <div class="detail-value">${alarm.typeName}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">告警级别：</div>
                        <div class="detail-value"><span class="alarm-level ${alarm.level}">${alarm.levelName}</span></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">告警状态：</div>
                        <div class="detail-value"><span class="alarm-status ${alarm.status}">${alarm.statusName}</span></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">处理类型：</div>
                        <div class="detail-value"><span style="color: ${alarm.isDisposable ? '#f5222d' : '#1890ff'}">${alarm.isDisposableName}</span></div>
                    </div>
                </div>

                <div class="detail-section">
                    <h3>告警详情</h3>
                    <div class="detail-item">
                        <div class="detail-label">告警信息：</div>
                        <div class="detail-value">${alarm.description}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">告警时间：</div>
                        <div class="detail-value">${alarm.time}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">设备名称：</div>
                        <div class="detail-value">${alarm.device}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">告警位置：</div>
                        <div class="detail-value">${alarm.location}</div>
                    </div>
                </div>

                ${alarm.status === 'resolved' || alarm.status === 'closed' ? `
                <div class="detail-section">
                    <h3>处理信息</h3>
                    <div class="detail-item">
                        <div class="detail-label">处理时间：</div>
                        <div class="detail-value">${alarm.processTime}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">处理人：</div>
                        <div class="detail-value">${alarm.processor}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">处理结果：</div>
                        <div class="detail-value">${alarm.processResult}</div>
                    </div>
                </div>
                ` : ''}

                ${alarm.status === 'pending' ? `
                <div class="process-section">
                    <h3>处理告警</h3>
                    <textarea id="processComment" placeholder="请输入处理意见..."></textarea>
                    <div class="process-actions">
                        <button class="cancel-btn" onclick="closeModal()">取消</button>
                        <button class="reject-btn" onclick="closeAlarm('${alarm.id}')">标记为误报</button>
                        <button class="resolve-btn" onclick="resolveAlarm('${alarm.id}')">标记为已解决</button>
                    </div>
                </div>
                ` : ''}
            `;

            modal.style.display = 'block';
        }

        // 处理告警
        function processAlarm(alarmId) {
            viewAlarmDetail(alarmId);
        }

        // 解决告警
        function resolveAlarm(alarmId) {
            const alarm = allAlarms.find(a => a.id === alarmId);
            if (!alarm) return;

            const comment = document.getElementById('processComment').value;
            
            alarm.status = 'resolved';
            alarm.statusName = '已解决';
            alarm.processTime = new Date().toLocaleString('zh-CN');
            alarm.processor = '当前用户';
            alarm.processResult = comment || '告警已处理，无异常';

            // 更新筛选后的告警列表
            filteredAlarms = filteredAlarms.map(a => a.id === alarmId ? alarm : a);

            // 重新渲染页面
            renderStats();
            renderAlarmList();

            // 关闭模态框
            closeModal();

            // 显示成功消息
            alert('告警已成功标记为已解决！');
        }

        // 关闭告警（误报）
        function closeAlarm(alarmId) {
            const alarm = allAlarms.find(a => a.id === alarmId);
            if (!alarm) return;

            const comment = document.getElementById('processComment').value;
            
            alarm.status = 'closed';
            alarm.statusName = '已关闭';
            alarm.processTime = new Date().toLocaleString('zh-CN');
            alarm.processor = '当前用户';
            alarm.processResult = comment || '误报，已关闭';

            // 更新筛选后的告警列表
            filteredAlarms = filteredAlarms.map(a => a.id === alarmId ? alarm : a);

            // 重新渲染页面
            renderStats();
            renderAlarmList();

            // 关闭模态框
            closeModal();

            // 显示成功消息
            alert('告警已成功标记为误报！');
        }

        // 关闭模态框
        function closeModal() {
            const modal = document.getElementById('alarmDetailModal');
            modal.style.display = 'none';
        }

        // 筛选告警
        function filterAlarms() {
            const type = document.getElementById('alarmType').value;
            const level = document.getElementById('alarmLevel').value;
            const status = document.getElementById('alarmStatus').value;
            const disposable = document.getElementById('disposable').value;
            const search = document.getElementById('searchInput').value.toLowerCase();

            filteredAlarms = allAlarms.filter(alarm => {
                const matchesType = type === '' || alarm.type === type;
                const matchesLevel = level === '' || alarm.level === level;
                const matchesStatus = status === '' || alarm.status === status;
                const matchesDisposable = disposable === '' || alarm.isDisposable === (disposable === 'true');
                const matchesSearch = search === '' || 
                    alarm.typeName.toLowerCase().includes(search) ||
                    alarm.description.toLowerCase().includes(search) ||
                    alarm.device.toLowerCase().includes(search) ||
                    alarm.location.toLowerCase().includes(search);

                return matchesType && matchesLevel && matchesStatus && matchesDisposable && matchesSearch;
            });

            // 重置页码并重新计算总页数
            window.alarmCurrentPage = 1;
            calculateAlarmTotalPages();
            
            // 重新渲染告警列表
            renderPagedAlarmList();
            updateAlarmPaginationUI();
        }

        // 重置筛选条件
        function resetFilters() {
            document.getElementById('alarmType').value = '';
            document.getElementById('alarmLevel').value = '';
            document.getElementById('alarmStatus').value = '';
            document.getElementById('disposable').value = '';
            document.getElementById('searchInput').value = '';

            filteredAlarms = [...allAlarms];
            
            // 重置页码并重新计算总页数
            window.alarmCurrentPage = 1;
            calculateAlarmTotalPages();
            
            // 重新渲染告警列表
            renderPagedAlarmList();
            updateAlarmPaginationUI();
        }

        // 绑定事件
        function bindEvents() {
            // 筛选事件
            document.getElementById('alarmType').addEventListener('change', filterAlarms);
            document.getElementById('alarmLevel').addEventListener('change', filterAlarms);
            document.getElementById('alarmStatus').addEventListener('change', filterAlarms);
            document.getElementById('disposable').addEventListener('change', filterAlarms);
            document.getElementById('searchInput').addEventListener('input', filterAlarms);
            document.getElementById('searchBtn').addEventListener('click', filterAlarms);
            document.getElementById('resetBtn').addEventListener('click', resetFilters);

            // 模态框事件
            const modal = document.getElementById('alarmDetailModal');
            const closeBtn = modal.querySelector('.close-btn');

            closeBtn.addEventListener('click', closeModal);

            // 点击模态框外部关闭模态框
            window.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModal();
                }
            });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
