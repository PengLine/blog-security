<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧安检系统 - 集中判图</title>
    
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 主容器样式 */
        .container {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #0a1929;
            color: #ffffff;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .page-header {
            background-color: #10253b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .page-header h1 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #909399;
            padding: 8px 16px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background-color: #18304a;
            color: #ffffff;
        }

        .nav-links a.active {
            background-color: #18304a;
            color: #409eff;
        }

        /* 模块容器 */
        .module {
            padding: 20px;
            flex: 1;
            overflow: hidden;
        }

        /* 集中判图界面 */
        .judge-container {
            display: grid;
            grid-template-columns: 300px 1fr 250px;
            gap: 20px;
            height: 100%;
            width: 100%;
        }

        /* 判图列表 */
        .judge-list-panel {
            background-color: #10253b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            overflow-y: auto;
        }

        .panel-title {
            font-size: 16px;
            margin-bottom: 15px;
            color: #ffffff;
            border-bottom: 1px solid #1e3a5f;
            padding-bottom: 10px;
        }

        .judge-item {
            padding: 12px;
            margin-bottom: 8px;
            background-color: #18304a;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .judge-item:hover {
            background-color: #204060;
        }

        .judge-item.active {
            background-color: #204060;
            border-left: 3px solid #409eff;
        }

        .judge-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .judge-item-time {
            font-size: 12px;
            color: #909399;
        }

        .judge-item-status {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
        }

        .status-pending { background-color: #e6a23c; color: #ffffff; }
        .status-processing { background-color: #409eff; color: #ffffff; }
        .status-completed { background-color: #67c23a; color: #ffffff; }

        .judge-item-device {
            font-size: 13px;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .judge-item-info {
            font-size: 11px;
            color: #909399;
        }

        /* 图片查看区域 */
        .image-panel {
            background-color: #10253b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .image-container {
            flex: 1;
            background-color: #000;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .main-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
            cursor: grab;
        }

        .main-image:active {
            cursor: grabbing;
        }

        /* 图片缩放控制 */
        .zoom-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .zoom-btn {
            width: 40px;
            height: 40px;
            background-color: rgba(0, 0, 0, 0.6);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease;
        }

        .zoom-btn:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        .zoom-value {
            display: flex;
            align-items: center;
            padding: 0 15px;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            color: white;
            font-size: 14px;
        }

        .image-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            font-size: 12px;
            color: #ffffff;
        }

        .image-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: #409eff;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #66b1ff;
        }

        .btn-danger {
            background-color: #f56c6c;
            color: #ffffff;
        }

        .btn-danger:hover {
            background-color: #f78989;
        }

        .btn-secondary {
            background-color: #606266;
            color: #ffffff;
        }

        .btn-secondary:hover {
            background-color: #737579;
        }

        /* 操作面板 */
        .operation-panel {
            background-color: #10253b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            overflow-y: auto;
        }

        .operation-section {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #1e3a5f;
        }

        .section-title {
            font-size: 14px;
            margin-bottom: 10px;
            color: #409eff;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .info-label {
            color: #909399;
        }

        .info-value {
            color: #ffffff;
            font-weight: 500;
        }

        .contraband-select {
            width: 100%;
            padding: 6px 12px;
            background-color: #18304a;
            border: 1px solid #1e3a5f;
            color: #ffffff;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .contraband-select:focus {
            outline: none;
            border-color: #409eff;
        }

        .remark-input {
            width: 100%;
            padding: 6px 12px;
            background-color: #18304a;
            border: 1px solid #1e3a5f;
            color: #ffffff;
            border-radius: 4px;
            font-size: 13px;
            resize: vertical;
            min-height: 80px;
        }

        .remark-input:focus {
            outline: none;
            border-color: #409eff;
        }

        /* 响应式设计 */
        @media (max-width: 1400px) {
            .judge-container {
                grid-template-columns: 250px 1fr 200px;
            }
        }

        @media (max-width: 1200px) {
            .judge-container {
                grid-template-columns: 1fr;
                height: auto;
            }

            .judge-list-panel,
            .operation-panel {
                max-height: 300px;
            }

            .image-container {
                min-height: 400px;
            }
        }

        @media (max-width: 768px) {
            .main-nav {
                display: none;
            }

            .judge-container {
                gap: 15px;
            }

            .module {
                padding: 10px;
            }

            .judge-list-panel,
            .operation-panel {
                padding: 15px;
            }
        }

        @media (max-width: 576px) {
            .logo {
                font-size: 20px;
            }

            .system-info {
                display: none;
            }

            .image-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>集中判图</h1>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="dashboard.html">仪表盘</a>
                <a href="device.html">设备管理</a>
                <a href="events.html">事件中心</a>
                <a href="judge.html" class="active">集中判图</a>
                <a href="alarm.html">告警中心</a>
                <a href="analysis.html">统计分析</a>
                <a href="passage.html">通行管理</a>
                <a href="face.html">人脸识别</a>
                <a href="config.html">系统配置</a>
            </div>
        </div>
        
        <!-- 集中判图模块 -->
        <div class="module" id="judge">
            <div class="judge-container">
            <!-- 判图列表 -->
            <div class="judge-list-panel">
                <div class="panel-title">判图任务列表</div>
                
                <!-- 批量操作控制 -->
                <div class="batch-controls" style="margin-bottom: 15px; padding: 10px; background-color: #18304a; border-radius: 4px;">
                    <div style="display: flex; align-items: center; margin-bottom: 10px;">
                        <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()" style="margin-right: 8px; accent-color: #409eff;">
                        <label for="selectAllCheckbox" style="font-size: 13px; color: #ffffff; cursor: pointer;">全选</label>
                        <span style="margin-left: 10px; font-size: 12px; color: #909399;">已选择: <span id="selectedCount">0</span>项</span>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;">
                        <button class="action-btn btn-primary" onclick="batchAccept()" style="padding: 6px 0; font-size: 12px; width: 100%;">批量通过</button>
                        <button class="action-btn btn-danger" onclick="batchReject()" style="padding: 6px 0; font-size: 12px; width: 100%;">批量可疑</button>
                        <button class="action-btn btn-secondary" onclick="batchReview()" style="padding: 6px 0; font-size: 12px; width: 100%;">批量审核</button>
                    </div>
                </div>
                
                <div id="judgeList"></div>
                
                <!-- 分页控制 -->
                <div class="pagination-controls" style="margin-top: 15px; padding: 10px; background-color: #18304a; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
                    <div style="display: flex; align-items: center;">
                        <label for="pageSizeSelect" style="color: #909399; margin-right: 8px;">每页显示:</label>
                        <select id="pageSizeSelect" onchange="changePageSize()" style="padding: 4px 8px; background-color: #0a1929; border: 1px solid #1e3a5f; color: #ffffff; border-radius: 4px; font-size: 12px;">
                            <option value="10" selected>10条</option>
                            <option value="20">20条</option>
                            <option value="30">30条</option>
                            <option value="50">50条</option>
                        </select>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <button class="action-btn btn-secondary" onclick="goToPage(1)" id="firstPageBtn" style="padding: 4px 8px; font-size: 12px;">首页</button>
                        <button class="action-btn btn-secondary" onclick="goToPage(window.currentPage - 1)" id="prevPageBtn" style="padding: 4px 8px; font-size: 12px;">上一页</button>
                        <span style="color: #ffffff;">第 <span id="currentPageSpan">1</span>/<span id="totalPagesSpan">1</span> 页</span>
                        <button class="action-btn btn-secondary" onclick="goToPage(window.currentPage + 1)" id="nextPageBtn" style="padding: 4px 8px; font-size: 12px;">下一页</button>
                        <button class="action-btn btn-secondary" onclick="goToPage(window.totalPages)" id="lastPageBtn" style="padding: 4px 8px; font-size: 12px;">末页</button>
                    </div>
                </div>
            </div>
            
            <!-- 图片查看区域 -->
            <div class="image-panel">
                <div class="panel-title">图片查看</div>
                
                <!-- 视角切换控制 -->
                <div class="view-controls" style="display: flex; justify-content: center; margin-bottom: 15px; gap: 10px;">
                    <button class="action-btn btn-secondary" onclick="switchView('single')" id="singleViewBtn" style="font-size: 13px; padding: 8px 16px;">单视角</button>
                    <button class="action-btn btn-secondary" onclick="switchView('dual')" id="dualViewBtn" style="font-size: 13px; padding: 8px 16px;">双视角</button>
                    <button class="action-btn btn-primary" onclick="toggleMergePreview()" id="mergePreviewBtn" style="font-size: 13px; padding: 8px 16px;">合并预览</button>
                    <select id="mergeModeSelect" style="padding: 8px 12px; background-color: #18304a; border: 1px solid #1e3a5f; color: #ffffff; border-radius: 4px; font-size: 13px; display: none;">
                        <option value="overlay">叠加</option>
                        <option value="side-by-side">并排</option>
                        <option value="blend">混合</option>
                    </select>
                </div>
                
                <div class="image-container" id="imageContainer" style="position: relative;">
                    <!-- 单视角模式 -->
                    <div id="singleView" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background-color: #000;">
                        <img id="mainImage" class="main-image" src="https://picsum.photos/800/600" alt="安检图片(主视角)">
                    </div>
                    
                    <!-- 双视角模式 -->
                    <div id="dualView" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none;">
                        <div style="width: 50%; height: 100%; float: left; display: flex; justify-content: center; align-items: center; background-color: #000;">
                            <img id="view1Image" class="main-image" src="https://picsum.photos/800/600?random=1" alt="安检图片(视角1)">
                        </div>
                        <div style="width: 50%; height: 100%; float: right; display: flex; justify-content: center; align-items: center; background-color: #000;">
                            <img id="view2Image" class="main-image" src="https://picsum.photos/800/600?random=2" alt="安检图片(视角2)">
                        </div>
                    </div>
                    
                    <!-- 标记用的Canvas -->
                    <canvas id="markCanvas" style="position: absolute; top: 0; left: 0; pointer-events: none;"></canvas>
                    
                    <!-- 合并预览覆盖层 -->
                    <canvas id="mergeCanvas" style="position: absolute; top: 0; left: 0; pointer-events: none; display: none;"></canvas>
                    
                    <div class="image-info">
                        <div>图片ID: <span id="imageId">IMG-001</span></div>
                        <div>设备: <span id="imageDevice">安检机001</span></div>
                        <div style="display: none;" id="viewInfo">视角: <span id="currentView">主视角</span></div>
                    </div>
                    <!-- 图片缩放控制 -->
                    <div class="zoom-controls">
                        <button class="zoom-btn" id="zoomOutBtn" onclick="zoomImage(-0.1)">-</button>
                        <div class="zoom-value" id="zoomValue">100%</div>
                        <button class="zoom-btn" id="zoomInBtn" onclick="zoomImage(0.1)">+</button>
                    </div>
                    <!-- 标记工具 -->
                    <div class="marking-tools" style="position: absolute; top: 20px; left: 20px; z-index: 10;">
                        <button class="zoom-btn" onclick="toggleMarking()" id="markingToggleBtn" title="启用/禁用标记">✏️</button>
                    </div>
                </div>
                <div class="image-actions">
                    <button class="action-btn btn-primary" onclick="acceptJudgement()">正常通过</button>
                    <button class="action-btn btn-danger" onclick="rejectJudgement()">可疑</button>
                    <button class="action-btn btn-secondary" onclick="reviewJudgement()">审核</button>
                </div>
            </div>
            
            <!-- 操作面板 -->
            <div class="operation-panel">
                <div class="panel-title">操作面板</div>
                
                <!-- 标签页切换 -->
                <div style="display: flex; margin-bottom: 15px; border-bottom: 1px solid #1e3a5f;">
                    <button class="tab-btn active" onclick="switchTab('current')" style="padding: 8px 15px; background: none; border: none; color: #409eff; font-size: 13px; cursor: pointer; border-bottom: 2px solid #409eff;">当前任务</button>
                    <button class="tab-btn" onclick="switchTab('history')" style="padding: 8px 15px; background: none; border: none; color: #909399; font-size: 13px; cursor: pointer;">历史记录</button>
                </div>
                
                <!-- 当前任务标签页 -->
                <div id="currentTab" style="display: block;">
                    <!-- 图片信息 -->
                    <div class="operation-section">
                        <div class="section-title">图片信息</div>
                        <div class="info-item">
                            <span class="info-label">图片ID</span>
                            <span class="info-value" id="opImageId">IMG-001</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">设备</span>
                            <span class="info-value" id="opImageDevice">安检机001</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">时间</span>
                            <span class="info-value" id="opImageTime">2026-01-16 10:30:00</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">位置</span>
                            <span class="info-value" id="opImageLocation">1号通道</span>
                        </div>
                    </div>
                    
                    <!-- 判图结果 -->
                    <div class="operation-section">
                        <div class="section-title">判图结果</div>
                        <select class="contraband-select" id="contrabandType">
                            <option value="">无违禁品</option>
                            <option value="刀具">刀具</option>
                            <option value="液体">液体</option>
                            <option value="电池">电池</option>
                            <option value="其他">其他</option>
                        </select>
                        <textarea class="remark-input" id="remark" placeholder="请输入判图备注"></textarea>
                    </div>
                    
                    <!-- 操作按钮 -->
                    <div class="operation-section">
                        <div class="section-title">操作</div>
                        <button class="action-btn btn-primary" onclick="saveJudgement()" style="width: 100%; margin-bottom: 8px;">保存结果</button>
                        <button class="action-btn btn-secondary" onclick="skipJudgement()" style="width: 100%;">跳过</button>
                        <button class="action-btn btn-danger" onclick="deleteJudgement()" style="width: 100%; margin-top: 8px;">删除</button>
                    </div>
                </div>
                
                <!-- 历史记录标签页 -->
                <div id="historyTab" style="display: none;">
                    <!-- 历史记录列表 -->
                    <div class="operation-section">
                        <div class="section-title">历史判图记录</div>
                        <div style="max-height: 200px; overflow-y: auto; margin-bottom: 10px;">
                            <div id="historyList"></div>
                        </div>
                        <button class="action-btn btn-primary" onclick="loadMoreHistory()" style="width: 100%; font-size: 12px; padding: 6px 0;">加载更多</button>
                    </div>
                    
                    <!-- 历史记录详情 -->
                    <div class="operation-section" id="historyDetail" style="display: none;">
                        <div class="section-title">历史记录详情</div>
                        <div class="info-item">
                            <span class="info-label">处理时间</span>
                            <span class="info-value" id="historyProcessTime"></span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">处理结果</span>
                            <span class="info-value" id="historyResult"></span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">违禁品类型</span>
                            <span class="info-value" id="historyContraband"></span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">处理人</span>
                            <span class="info-value" id="historyOperator"></span>
                        </div>
                        <div style="margin-top: 10px;">
                            <label style="font-size: 12px; color: #909399; margin-bottom: 5px; display: block;">备注</label>
                            <div id="historyRemark" style="font-size: 12px; color: #ffffff; background-color: #18304a; padding: 8px; border-radius: 4px; min-height: 50px;"></div>
                        </div>
                        <button class="action-btn btn-secondary" onclick="closeHistoryDetail()" style="width: 100%; margin-top: 10px; font-size: 12px; padding: 6px 0;">关闭详情</button>
                    </div>
                </div>
                
                <!-- 统计信息 -->
                <div class="operation-section">
                    <div class="section-title">统计信息</div>
                    <div class="info-item">
                        <span class="info-label">今日判图</span>
                        <span class="info-value">125</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">待判图</span>
                        <span class="info-value">32</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">判图准确率</span>
                        <span class="info-value">98.5%</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 模拟数据生成函数
        function generateMockData() {
            const judgeResults = ["待处理", "处理中", "已完成"];
            const devices = ["安检机001", "安检机002", "安检机003", "安检机004", "安检机005"];
            const locations = ["1号通道", "2号通道", "3号通道", "4号通道", "5号通道"];
            
            const judgeItems = [];
            for (let i = 0; i < 30; i++) {
                const time = new Date(Date.now() - Math.random() * 3600000);
                const statusIndex = Math.floor(Math.random() * judgeResults.length);
                const status = judgeResults[statusIndex];
                const deviceIndex = Math.floor(Math.random() * devices.length);
                const locationIndex = Math.floor(Math.random() * locations.length);
                
                judgeItems.push({
                    id: `JUD-${Date.now()}-${i}`,
                    time: time.toLocaleString(),
                    device: devices[deviceIndex],
                    deviceId: `DEV-${deviceIndex + 100}`,
                    status: status,
                    statusClass: status === "待处理" ? "status-pending" : (status === "处理中" ? "status-processing" : "status-completed"),
                    imageId: `IMG-${Date.now()}-${i}`,
                    imageUrl: `https://picsum.photos/800/600?random=${i}`,
                    thumbnailUrl: `https://picsum.photos/200/100?random=${i}`,
                    location: locations[locationIndex],
                    passengerId: Math.random() > 0.5 ? `PASS-${Math.floor(Math.random() * 10000)}` : "未知"
                });
            }
            
            // 按时间倒序排序
            judgeItems.sort((a, b) => new Date(b.time) - new Date(a.time));
            
            return judgeItems;
        }

        // 更新时间显示
        function updateTime() {
            const now = new Date();
            const timeDisplay = document.getElementById('currentTime');
            if (timeDisplay) {

        // 更新缩放显示和图片大小
        function updateZoom() {
            const image = document.getElementById('mainImage');
            const zoomValue = document.getElementById('zoomValue');

            if (image && zoomValue) {

        // 切换标记功能
        function toggleMarking() {
            window.isMarkingEnabled = !window.isMarkingEnabled;
            const toggleBtn = document.getElementById('markingToggleBtn');
            const canvas = document.getElementById('markCanvas');
            
            if (toggleBtn) {
                toggleBtn.style.backgroundColor = window.isMarkingEnabled ? 'rgba(245, 108, 108, 0.6)' : 'rgba(0, 0, 0, 0.6)';
            }

        // 开始标记
        function startMarking(e) {
            if (!window.isMarkingEnabled) return;
            
            const canvas = document.getElementById('markCanvas');
            if (!canvas) return;
            
            // 获取鼠标在Canvas上的坐标
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // 开始新的标记
            window.currentMarking = { startX: x, startY: y, endX: x, endY: y };
        }
        
        // 绘制标记
        function drawMarking(e) {
            if (!window.isMarkingEnabled || !window.currentMarking) return;
            
            const canvas = document.getElementById('markCanvas');
            const ctx = canvas.getContext('2d');
            if (!canvas || !ctx) return;
            
            // 获取鼠标在Canvas上的坐标
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // 更新当前标记的结束坐标
            window.currentMarking.endX = x;
            window.currentMarking.endY = y;
            
            // 重新绘制所有标记
            redrawAllMarks();
            
            // 绘制当前进行中的标记
            drawSingleMark(ctx, window.currentMarking, true);
        }
        
        // 完成标记
        function finishMarking() {
            if (!window.isMarkingEnabled || !window.currentMarking) return;
            
            // 保存完成的标记
            window.markPoints.push(window.currentMarking);
            window.currentMarking = null;
            
            // 重新绘制所有标记
            redrawAllMarks();
        }
        
        // 重新绘制所有标记
        function redrawAllMarks() {
            const canvas = document.getElementById('markCanvas');
            const ctx = canvas.getContext('2d');
            if (!canvas || !ctx) return;
            
            // 清除Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制所有已保存的标记
            window.markPoints.forEach(mark => drawSingleMark(ctx, mark, false));
        }
        
        // 绘制单个标记
        function drawSingleMark(ctx, mark, isCurrent) {
            // 计算矩形坐标
            const x = Math.min(mark.startX, mark.endX);
            const y = Math.min(mark.startY, mark.endY);
            const width = Math.abs(mark.endX - mark.startX);
            const height = Math.abs(mark.endY - mark.startY);
            
            // 设置样式
            ctx.strokeStyle = isCurrent ? '#ff4d4f' : '#409eff';
            ctx.lineWidth = 2;
            ctx.setLineDash(isCurrent ? [5, 5] : []);
            
            // 绘制矩形
            ctx.strokeRect(x, y, width, height);
            
            // 绘制对角线
            ctx.beginPath();
            ctx.moveTo(mark.startX, mark.startY);
            ctx.lineTo(mark.endX, mark.endY);
            ctx.moveTo(mark.startX, mark.endY);
            ctx.lineTo(mark.endX, mark.startY);
            ctx.stroke();
            
            // 重置样式
            ctx.setLineDash([]);
        }

        // 生成历史记录数据
        function generateHistoryData() {
            const results = ['正常通过', '可疑', '审核', '已处理'];
            const contrabandTypes = ['', '刀具', '液体', '电池', '其他'];
            const operators = ['张三', '李四', '王五', '赵六'];
            
            const historyRecords = [];
            for (let i = 0; i < 20; i++) {
                const time = new Date(Date.now() - Math.random() * 86400000 * 30); // 近30天
                const result = results[Math.floor(Math.random() * results.length)];
                const contrabandType = result !== '正常通过' ? contrabandTypes[Math.floor(Math.random() * contrabandTypes.length)] : '';
                const operator = operators[Math.floor(Math.random() * operators.length)];
                
                historyRecords.push({
                    id: `HIST-${Date.now()}-${i}`,
                    imageId: `IMG-${Date.now()}-${i}`,
                    device: `安检机00${Math.floor(Math.random() * 5) + 1}`,
                    time: time.toLocaleString(),
                    processTime: time.toLocaleString(),
                    result: result,
                    contrabandType: contrabandType,
                    operator: operator,
                    remark: result !== '正常通过' ? `发现${contrabandType || '可疑物品'}，已${result}` : '无异常'
                });
            }
            
            // 按时间倒序排序
            historyRecords.sort((a, b) => new Date(b.time) - new Date(a.time));
            
            return historyRecords;
        }

        // 更新合并预览
        function updateMergePreview() {
            const mergeCanvas = document.getElementById('mergeCanvas');
            const mainImage = document.getElementById('mainImage');
            const view1Image = document.getElementById('view1Image');
            const view2Image = document.getElementById('view2Image');
            
            if (!mergeCanvas || !mainImage || !view1Image || !view2Image) return;
            
            // 设置画布尺寸
            mergeCanvas.width = mainImage.offsetWidth;
            mergeCanvas.height = mainImage.offsetHeight;
            
            const ctx = mergeCanvas.getContext('2d');
            if (!ctx) return;
            
            // 清除画布
            ctx.clearRect(0, 0, mergeCanvas.width, mergeCanvas.height);
            
            // 根据合并模式进行合并
            if (window.mergeMode === 'overlay') {
                // 叠加模式
                ctx.globalAlpha = 0.5;
                ctx.drawImage(view1Image, 0, 0, mergeCanvas.width, mergeCanvas.height);
                ctx.globalAlpha = 0.5;
                ctx.drawImage(view2Image, 0, 0, mergeCanvas.width, mergeCanvas.height);
                ctx.globalAlpha = 1.0;
            } else if (window.mergeMode === 'side-by-side') {
                // 并排模式
                const halfWidth = mergeCanvas.width / 2;
                ctx.drawImage(view1Image, 0, 0, halfWidth, mergeCanvas.height);
                ctx.drawImage(view2Image, halfWidth, 0, halfWidth, mergeCanvas.height);
            } else if (window.mergeMode === 'blend') {
                // 混合模式
                ctx.drawImage(view1Image, 0, 0, mergeCanvas.width, mergeCanvas.height);
                ctx.globalCompositeOperation = 'multiply';
                ctx.drawImage(view2Image, 0, 0, mergeCanvas.width, mergeCanvas.height);
                ctx.globalCompositeOperation = 'source-over';
            }
        }
        
        // 改变合并模式
        function changeMergeMode() {
            const selectElement = document.getElementById('mergeModeSelect');
            window.mergeMode = selectElement.value;
            
            if (window.isMergePreview) {
                updateMergePreview();
            }
        }
        
        // 更新缩放功能以支持双视角
        function updateZoom() {
            const image = document.getElementById('mainImage');
            const view1Image = document.getElementById('view1Image');
            const view2Image = document.getElementById('view2Image');
            const zoomValue = document.getElementById('zoomValue');
            const canvas = document.getElementById('markCanvas');
            const mergeCanvas = document.getElementById('mergeCanvas');
            
            if (image && zoomValue) {
                const zoomPercentage = Math.round(window.currentZoom * 100);
                zoomValue.textContent = `${zoomPercentage}%`;
                
                // 应用缩放到所有图片
                image.style.transform = `scale(${window.currentZoom})`;
                if (view1Image) view1Image.style.transform = `scale(${window.currentZoom})`;
                if (view2Image) view2Image.style.transform = `scale(${window.currentZoom})`;
                
                // 重新调整Canvas尺寸
                if (canvas) {
                    canvas.width = image.offsetWidth;
                    canvas.height = image.offsetHeight;
                }
                
                if (mergeCanvas) {
                    mergeCanvas.width = image.offsetWidth;
                    mergeCanvas.height = image.offsetHeight;
                }
                
                // 更新合并预览
                if (window.isMergePreview) {
                    updateMergePreview();
                }
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 生成并渲染数据
            const judgeItems = generateMockData();
            window.judgeData = judgeItems;
            
            // 初始化分页
            initPagination();
            
            // 选择第一个项
            if (judgeItems.length > 0) {
                window.currentJudgeItem = judgeItems[0];
                document.getElementById('imageId').textContent = judgeItems[0].imageId;
                document.getElementById('imageDevice').textContent = judgeItems[0].device;
                document.getElementById('mainImage').src = judgeItems[0].imageUrl;
                
                document.getElementById('opImageId').textContent = judgeItems[0].imageId;
                document.getElementById('opImageDevice').textContent = judgeItems[0].device;
                document.getElementById('opImageTime').textContent = judgeItems[0].time;
                document.getElementById('opImageLocation').textContent = judgeItems[0].location;
            }
        });
    </script>
</div>
</body>
</html>
