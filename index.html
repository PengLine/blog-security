<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧安检系统 - 运营管理平台</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="container">
        <!-- 顶部导航栏 -->
        <div class="header">
            <div class="mobile-nav-btn" id="mobileNavBtn">☰</div>
            <div class="logo">智慧安检系统</div>
            <div class="main-nav">
                <div class="nav-item active" data-nav="dashboard">首页</div>
                <div class="nav-item" data-nav="device">设备管理</div>
                <div class="nav-item" data-nav="events">事件中心</div>
                <div class="nav-item" data-nav="judge">集中判图<span class="nav-badge" id="badgeJudge"></span></div>
                <div class="nav-item" data-nav="alarm">告警中心<span class="nav-badge" id="badgeAlarm"></span></div>
                <div class="nav-item" data-nav="analysis">统计分析</div>
                <div class="nav-item" data-nav="passage">通行管理</div>
                <div class="nav-item" data-nav="face">人脸识别</div>
                <div class="nav-item" data-nav="handoff">处置交接<span class="nav-badge" id="badgeHandoff"></span></div>
                <div class="nav-item" data-nav="config">配置管理</div>
            </div>
            <div class="system-info">
                <div class="time-display" id="currentTime"></div>
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span>系统正常</span>
                </div>
            </div>
        </div>

        <!-- 移动端遮罩层 -->
        <div class="overlay" id="overlay"></div>

        <!-- 标签页系统 -->
        <div class="tabs" id="tabs">
            <div class="tab-item active" data-tab="dashboard">
                首页
                <span class="tab-close">×</span>
            </div>
        </div>

        <!-- 主容器 -->
        <div class="main-container">
            <!-- 左侧设备导航 -->
            <div class="sidebar">
                <div class="device-category">
                    <div class="category-title">核心设备</div>
                    <div class="device-item active" data-device="securityCheckMachine">安检机</div>
                    <div class="device-item" data-device="recheckTable">复检台</div>
                </div>

                <div class="device-category">
                    <div class="category-title">安检门</div>
                    <div class="device-item" data-device="metalDoor">金属门</div>
                    <div class="device-item" data-device="millimeterWaveDoor">毫米波门</div>
                    <div class="device-item" data-device="antiTheftDoor">防损门</div>
                    <div class="device-item" data-device="classificationDoor">分类门</div>
                </div>

                <div class="device-category">
                    <div class="category-title">明眸设备</div>
                    <div class="device-item" data-device="accessControl">门禁设备</div>
                    <div class="device-item" data-device="accessVideo">门禁视频一体机</div>
                    <div class="device-item" data-device="personCertCompare">人证对比</div>
                </div>

                <div class="device-category">
                    <div class="category-title">探测设备</div>
                    <div class="device-item" data-device="explosiveDetector">炸探</div>
                    <div class="device-item" data-device="liquidDetector">液探</div>
                </div>
            </div>

            <!-- 主内容区域 -->
            <div class="content">
                <!-- 内容将通过JavaScript动态加载 -->
            </div>
        </div>

        <script type="module" src="js/utils.js?v=2"></script>
    </div>
</body>

</html>
