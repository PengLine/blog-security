<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧安检系统 - 事件中心</title>
    
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 主容器样式 */
        .container {
            font-family: 'Microsoft YaHei', Arial, sans-serif !important;
            background-color: #0a1929 !important;
            color: #ffffff !important;
            overflow-x: hidden !important;
            max-width: 1200px !important;
            margin: 0 auto !important;
            padding: 20px !important;
        }

        .page-header {
            background-color: #10253b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .page-header h1 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #909399;
            padding: 8px 16px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background-color: #18304a;
            color: #ffffff;
        }

        .nav-links a.active {
            background-color: #18304a;
            color: #409eff;
        }

        /* 模块容器 */
        .module {
            padding: 20px;
        }

        /* 筛选栏 */
        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #10253b;
            border-radius: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-label {
            font-size: 13px;
            color: #909399;
        }

        .filter-input,
        .filter-select {
            background-color: #18304a;
            border: 1px solid #1e3a5f;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
        }

        .filter-input:focus,
        .filter-select:focus {
            outline: none;
            border-color: #409eff;
        }

        .filter-button {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: #409eff;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #66b1ff;
        }

        .btn-secondary {
            background-color: #606266;
            color: #ffffff;
        }

        .btn-secondary:hover {
            background-color: #737579;
        }

        /* 数据表格 */
        .table-section {
            background-color: #10253b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .table-title {
            font-size: 16px;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #1e3a5f;
            font-size: 13px;
        }

        .data-table th {
            background-color: #18304a;
            color: #909399;
            font-weight: normal;
        }

        .data-table td {
            color: #ffffff;
        }

        /* 状态标签 */
        .status-tag {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            text-align: center;
        }

        .status-normal {
            background-color: #67c23a;
            color: #ffffff;
        }

        .status-warning {
            background-color: #e6a23c;
            color: #ffffff;
        }

        .status-danger {
            background-color: #f56c6c;
            color: #ffffff;
        }

        .status-processing {
            background-color: #409eff;
            color: #ffffff;
        }

        /* 操作按钮 */
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
            margin-right: 5px;
        }

        /* 事件详情面板 */
        .event-detail-panel {
            background-color: #10253b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .detail-title {
            font-size: 16px;
            margin-bottom: 15px;
            color: #ffffff;
            border-bottom: 1px solid #1e3a5f;
            padding-bottom: 10px;
        }

        .event-detail {
            background-color: #18304a;
            padding: 20px;
            border-radius: 8px;
        }

        .event-detail-item {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1e3a5f;
        }

        .event-detail-label {
            font-size: 13px;
            color: #909399;
            margin-bottom: 5px;
            display: block;
        }

        .event-detail-value {
            font-size: 14px;
            color: #ffffff;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-nav {
                display: none;
            }

            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }

            /* 表格优化 */
            .data-table {
                font-size: 12px;
            }

            .data-table th,
            .data-table td {
                padding: 8px 5px;
            }
        }

        @media (max-width: 576px) {
            .logo {
                font-size: 20px;
            }

            .system-info {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>事件中心</h1>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="dashboard.html">仪表盘</a>
                <a href="device.html">设备管理</a>
                <a href="events.html" class="active">事件中心</a>
                <a href="judge.html">集中判图</a>
                <a href="alarm.html">告警中心</a>
                <a href="analysis.html">统计分析</a>
                <a href="passage.html">通行管理</a>
                <a href="face.html">人脸识别</a>
                <a href="config.html">系统配置</a>
            </div>
        </div>
        
        <!-- 事件中心模块 -->
        <div class="module" id="events">
        <!-- 筛选栏 -->
        <div class="filter-bar">
            <div class="filter-group">
                <label class="filter-label">事件类型:</label>
                <select class="filter-select" id="eventTypeFilter">
                    <option value="">全部</option>
                    <option value="passenger">正常通过</option>
                    <option value="metal">金属检测</option>
                    <option value="contraband">违禁品检测</option>
                    <option value="face">人脸相关</option>
                    <option value="device">设备状态</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">状态:</label>
                <select class="filter-select" id="eventStatusFilter">
                    <option value="">全部</option>
                    <option value="normal">正常</option>
                    <option value="warning">警告</option>
                    <option value="danger">危险</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">处理状态:</label>
                <select class="filter-select" id="processStatusFilter">
                    <option value="">全部</option>
                    <option value="已处理">已处理</option>
                    <option value="处理中">处理中</option>
                    <option value="未处理">未处理</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">搜索:</label>
                <input type="text" class="filter-input" id="eventSearchInput" placeholder="输入设备名称或事件ID">
            </div>
            <div class="filter-group">
                <button class="filter-button btn-primary" onclick="filterEvents()">筛选</button>
                <button class="filter-button btn-secondary" onclick="resetFilters()">重置</button>
            </div>
        </div>
        
        <!-- 事件详情面板 -->
        <div class="event-detail-panel" id="eventDetailPanel" style="display: none;">
            <div class="detail-title">事件详情</div>
            <div class="event-detail" id="eventDetailContent"></div>
        </div>
        
        <!-- 事件列表 -->
        <div class="table-section">
            <div class="table-title">事件列表</div>
            <table class="data-table" id="eventsTable">
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>设备</th>
                        <th>类型</th>
                        <th>状态</th>
                        <th>处理状态</th>
                        <th>详情</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="eventsTableBody"></tbody>
            </table>
            
            <!-- 分页控制 -->
            <div class="pagination-controls" style="margin-top: 15px; padding: 15px 0; border-top: 1px solid #1e3a5f; display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
                <div style="display: flex; align-items: center;">
                    <label for="eventsPageSizeSelect" style="color: #909399; margin-right: 8px;">每页显示:</label>
                    <select id="eventsPageSizeSelect" onchange="changeEventsPageSize()" style="padding: 4px 8px; background-color: #18304a; border: 1px solid #1e3a5f; color: #ffffff; border-radius: 4px; font-size: 12px;">
                        <option value="10">10条</option>
                        <option value="20" selected>20条</option>
                        <option value="30">30条</option>
                        <option value="50">50条</option>
                    </select>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button class="btn btn-secondary" onclick="goToEventsPage(1)" id="eventsFirstPageBtn" style="font-size: 12px; padding: 4px 8px;">首页</button>
                    <button class="btn btn-secondary" onclick="goToEventsPage(window.eventsCurrentPage - 1)" id="eventsPrevPageBtn" style="font-size: 12px; padding: 4px 8px;">上一页</button>
                    <span style="color: #ffffff;">第 <span id="eventsCurrentPageSpan">1</span>/<span id="eventsTotalPagesSpan">1</span> 页</span>
                    <button class="btn btn-secondary" onclick="goToEventsPage(window.eventsCurrentPage + 1)" id="eventsNextPageBtn" style="font-size: 12px; padding: 4px 8px;">下一页</button>
                    <button class="btn btn-secondary" onclick="goToEventsPage(window.eventsTotalPages)" id="eventsLastPageBtn" style="font-size: 12px; padding: 4px 8px;">末页</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 模拟数据生成函数
        function generateMockData() {
            // 设备列表数据
            const deviceTypes = [
                { name: "安检机", type: "security", ip: "192.168.1.101", status: "online", location: "1号通道" },
                { name: "复检台", type: "security", ip: "192.168.1.102", status: "online", location: "2号通道" },
                { name: "金属门", type: "access", ip: "192.168.1.103", status: "online", location: "3号通道" },
                { name: "毫米波门", type: "access", ip: "192.168.1.104", status: "warning", location: "4号通道" },
                { name: "防损门", type: "access", ip: "192.168.1.105", status: "online", location: "5号通道" },
                { name: "门禁设备", type: "access", ip: "192.168.1.107", status: "online", location: "7号通道" },
                { name: "人证对比", type: "access", ip: "192.168.1.109", status: "online", location: "9号通道" },
                { name: "炸探", type: "detection", ip: "192.168.1.110", status: "online", location: "10号通道" },
                { name: "液探", type: "detection", ip: "192.168.1.111", status: "online", location: "11号通道" }
            ];

            // 事件类型
            const eventTypes = [
                { name: "正常通过", type: "passenger", status: "normal", desc: "人员正常通过安检" },
                { name: "金属检测", type: "metal", status: "warning", desc: "检测到金属物品" },
                { name: "违禁品检测", type: "contraband", status: "danger", desc: "检测到违禁物品" },
                { name: "温度异常", type: "face", status: "warning", desc: "体温检测异常" },
                { name: "未刷脸", type: "face", status: "warning", desc: "未进行人脸识别" },
                { name: "未注册", type: "face", status: "warning", desc: "人员未注册" },
                { name: "包裹异常", type: "contraband", status: "danger", desc: "包裹检测异常" },
                { name: "设备离线", type: "device", status: "danger", desc: "设备离线告警" },
                { name: "设备在线", type: "device", status: "normal", desc: "设备恢复在线" },
                { name: "网络异常", type: "system", status: "warning", desc: "网络连接异常" }
            ];

            // 状态映射
            const statusMap = {
                normal: { name: "正常", class: "status-normal" },
                warning: { name: "警告", class: "status-warning" },
                danger: { name: "危险", class: "status-danger" },
                processing: { name: "处理中", class: "status-processing" }
            };

            // 生成事件数据
            const events = [];
            for (let i = 0; i < 50; i++) {
                const time = new Date(Date.now() - Math.random() * 86400000);
                const eventType = eventTypes[Math.floor(Math.random() * eventTypes.length)];
                const device = deviceTypes[Math.floor(Math.random() * deviceTypes.length)];
                const status = statusMap[eventType.status];
                const processStatus = Math.random() > 0.7 ? "已处理" : (Math.random() > 0.5 ? "处理中" : "未处理");
                const passengerId = Math.random() > 0.5 ? `PASS-${Math.floor(Math.random() * 10000)}` : "未知";
                const contrabandType = eventType.type === "contraband" ? ["刀具", "液体", "电池", "其他"][Math.floor(Math.random() * 4)] : "无";
                
                events.push({
                    id: `EVT-${Date.now()}-${i}`,
                    time: time.toLocaleString(),
                    device: device.name,
                    deviceId: `DEV-${Math.floor(Math.random() * 1000)}`,
                    type: eventType.name,
                    typeCode: eventType.type,
                    status: status,
                    processStatus: processStatus,
                    passengerId: passengerId,
                    contrabandType: contrabandType,
                    details: `${eventType.desc}${eventType.type === "contraband" ? `，违禁品类型：${contrabandType}` : ""}${passengerId !== "未知" ? `，人员ID：${passengerId}` : ""}`,
                    fullDetails: {
                        id: `EVT-${Date.now()}-${i}`,
                        time: time.toLocaleString(),
                        device: device.name,
                        deviceId: `DEV-${Math.floor(Math.random() * 1000)}`,
                        deviceIP: device.ip,
                        deviceLocation: device.location,
                        eventType: eventType.name,
                        eventTypeCode: eventType.type,
                        status: status.name,
                        processStatus: processStatus,
                        passengerId: passengerId,
                        contrabandType: contrabandType,
                        description: eventType.desc,
                        resolution: processStatus === "已处理" ? ["已放行", "已拦截", "已上报", "已处理"][Math.floor(Math.random() * 4)] : "无",
                        operator: processStatus === "已处理" ? [`管理员A`, `管理员B`, `管理员C`][Math.floor(Math.random() * 3)] : "无",
                        processTime: processStatus === "已处理" ? new Date(time.getTime() + Math.random() * 3600000).toLocaleString() : "无"
                    }
                });
            }

            // 按时间倒序排序
            events.sort((a, b) => new Date(b.time) - new Date(a.time));

            return events;
        }

        // 更新时间显示
        function updateTime() {
            const now = new Date();
            const timeDisplay = document.getElementById('currentTime');
            if (timeDisplay) {
                timeDisplay.textContent = now.toLocaleString();
            }
        }

        // 渲染事件列表
        function renderEvents(events) {
            const tbody = document.getElementById('eventsTableBody');
            if (!tbody) return;
            
            tbody.innerHTML = '';

            events.forEach(event => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${event.time}</td>
                    <td>${event.device}</td>
                    <td>${event.type}</td>
                    <td><span class="status-tag ${event.status.class}">${event.status.name}</span></td>
                    <td>${event.processStatus}</td>
                    <td>${event.details}</td>
                    <td>
                        <button class="btn btn-primary" onclick="viewEventDetail('${event.id}')">查看</button>
                        <button class="btn btn-secondary" onclick="processEvent('${event.id}')">处理</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // 查看事件详情
        function viewEventDetail(eventId) {
            const events = window.eventsData;
            const event = events.find(e => e.id === eventId);
            if (!event) return;

            const detailPanel = document.getElementById('eventDetailPanel');
            const detailContent = document.getElementById('eventDetailContent');
            
            if (!detailPanel || !detailContent) return;

            // 渲染事件详情
            const fullDetails = event.fullDetails;
            detailContent.innerHTML = `
                <div class="event-detail-item">
                    <span class="event-detail-label">事件ID</span>
                    <span class="event-detail-value">${fullDetails.id}</span>
                </div>
                <div class="event-detail-item">
                    <span class="event-detail-label">事件时间</span>
                    <span class="event-detail-value">${fullDetails.time}</span>
                </div>
                <div class="event-detail-item">
                    <span class="event-detail-label">设备信息</span>
                    <span class="event-detail-value">${fullDetails.device} (${fullDetails.deviceId})</span>
                </div>
                <div class="event-detail-item">
                    <span class="event-detail-label">设备IP</span>
                    <span class="event-detail-value">${fullDetails.deviceIP}</span>
                </div>
                <div class="event-detail-item">
                    <span class="event-detail-label">设备位置</span>
                    <span class="event-detail-value">${fullDetails.deviceLocation}</span>
                </div>
                <div class="event-detail-item">
                    <span class="event-detail-label">事件类型</span>
                    <span class="event-detail-value">${fullDetails.eventType}</span>
                </div>
                <div class="event-detail-item">
                    <span class="event-detail-label">事件状态</span>
                    <span class="event-detail-value">${fullDetails.status}</span>
                </div>
                <div class="event-detail-item">
                    <span class="event-detail-label">处理状态</span>
                    <span class="event-detail-value">${fullDetails.processStatus}</span>
                </div>
                <div class="event-detail-item">
                    <span class="event-detail-label">人员ID</span>
                    <span class="event-detail-value">${fullDetails.passengerId}</span>
                </div>
                ${fullDetails.contrabandType !== "无" ? `
                    <div class="event-detail-item">
                        <span class="event-detail-label">违禁品类型</span>
                        <span class="event-detail-value">${fullDetails.contrabandType}</span>
                    </div>
                ` : ''}
                <div class="event-detail-item">
                    <span class="event-detail-label">事件描述</span>
                    <span class="event-detail-value">${fullDetails.description}</span>
                </div>
                <div class="event-detail-item">
                    <span class="event-detail-label">处理结果</span>
                    <span class="event-detail-value">${fullDetails.resolution}</span>
                </div>
                <div class="event-detail-item">
                    <span class="event-detail-label">处理人员</span>
                    <span class="event-detail-value">${fullDetails.operator}</span>
                </div>
                <div class="event-detail-item">
                    <span class="event-detail-label">处理时间</span>
                    <span class="event-detail-value">${fullDetails.processTime}</span>
                </div>
            `;

            // 显示详情面板
            detailPanel.style.display = 'block';
            detailPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // 处理事件
        function processEvent(eventId) {
            alert(`处理事件：${eventId}`);
            // 这里可以实现处理事件的逻辑
        }

        // 筛选事件
        function filterEvents() {
            const typeFilter = document.getElementById('eventTypeFilter').value;
            const statusFilter = document.getElementById('eventStatusFilter').value;
            const processStatusFilter = document.getElementById('processStatusFilter').value;
            const searchText = document.getElementById('eventSearchInput').value.toLowerCase();
            
            let events = [...window.eventsData];
            
            // 按类型筛选
            if (typeFilter) {
                events = events.filter(event => event.typeCode === typeFilter);
            }
            
            // 按状态筛选
            if (statusFilter) {
                events = events.filter(event => event.status.name === statusMap[statusFilter].name);
            }
            
            // 按处理状态筛选
            if (processStatusFilter) {
                events = events.filter(event => event.processStatus === processStatusFilter);
            }
            
            // 搜索
            if (searchText) {
                events = events.filter(event => 
                    event.device.toLowerCase().includes(searchText) ||
                    event.id.toLowerCase().includes(searchText)
                );
            }
            
            window.filteredEvents = events;
            
            // 重置页码并重新计算总页数
            window.eventsCurrentPage = 1;
            calculateEventsTotalPages();
            
            // 重新渲染事件列表
            renderPagedEvents();
            updateEventsPaginationUI();
        }

        // 重置筛选
        function resetFilters() {
            document.getElementById('eventTypeFilter').value = '';
            document.getElementById('eventStatusFilter').value = '';
            document.getElementById('processStatusFilter').value = '';
            document.getElementById('eventSearchInput').value = '';
            
            // 重置筛选后的事件列表
            window.filteredEvents = [...window.eventsData];
            
            // 重置页码并重新计算总页数
            window.eventsCurrentPage = 1;
            calculateEventsTotalPages();
            
            // 重新渲染事件列表
            renderPagedEvents();
            updateEventsPaginationUI();
        }

        // 状态映射（用于筛选）
        const statusMap = {
            normal: { name: "正常" },
            warning: { name: "警告" },
            danger: { name: "危险" }
        };
        
        // 分页变量
        window.eventsCurrentPage = 1;
        window.eventsPageSize = 20;
        window.eventsTotalPages = 1;
        window.filteredEvents = [];

        // 计算事件总页数
        function calculateEventsTotalPages() {
            window.eventsTotalPages = Math.ceil(window.filteredEvents.length / window.eventsPageSize);
            if (window.eventsTotalPages < 1) {
                window.eventsTotalPages = 1;
            }
        }

        // 渲染分页事件列表
        function renderPagedEvents() {
            const startIndex = (window.eventsCurrentPage - 1) * window.eventsPageSize;
            const endIndex = startIndex + window.eventsPageSize;
            const pagedData = window.filteredEvents.slice(startIndex, endIndex);
            
            renderEvents(pagedData);
        }

        // 更新分页UI
        function updateEventsPaginationUI() {
            document.getElementById('eventsCurrentPageSpan').textContent = window.eventsCurrentPage;
            document.getElementById('eventsTotalPagesSpan').textContent = window.eventsTotalPages;
            
            // 更新按钮状态
            document.getElementById('eventsFirstPageBtn').disabled = window.eventsCurrentPage === 1;
            document.getElementById('eventsPrevPageBtn').disabled = window.eventsCurrentPage === 1;
            document.getElementById('eventsNextPageBtn').disabled = window.eventsCurrentPage === window.eventsTotalPages;
            document.getElementById('eventsLastPageBtn').disabled = window.eventsCurrentPage === window.eventsTotalPages;
        }

        // 跳转到指定事件页码
        function goToEventsPage(pageNumber) {
            if (pageNumber < 1 || pageNumber > window.eventsTotalPages) {
                return;
            }
            
            window.eventsCurrentPage = pageNumber;
            renderPagedEvents();
            updateEventsPaginationUI();
        }

        // 改变每页显示数量
        function changeEventsPageSize() {
            const selectElement = document.getElementById('eventsPageSizeSelect');
            window.eventsPageSize = parseInt(selectElement.value);
            window.eventsCurrentPage = 1;
            
            calculateEventsTotalPages();
            renderPagedEvents();
            updateEventsPaginationUI();
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 生成并渲染数据
            const events = generateMockData();
            window.eventsData = events;
            window.filteredEvents = [...events];
            
            // 初始化分页
            calculateEventsTotalPages();
            renderPagedEvents();
            updateEventsPaginationUI();
        });
    </script>
</div>
</body>
</html>
