<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通行管理</title>

    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 主容器样式 */
        .container {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #0a1929;
            color: #ffffff;
            overflow-x: hidden;
            margin: 0 auto;
            padding: 20px;
        }

        .page-header {
            background-color: #10253b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .page-header h1 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #909399;
            padding: 8px 16px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background-color: #18304a;
            color: #ffffff;
        }

        .nav-links a.active {
            background-color: #18304a;
            color: #409eff;
        }

        /* 模块容器 */
        .module {
            padding: 20px;
        }

        /* 通行管理容器 */
        .passage-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-panel {
            background-color: #10253b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .panel-title {
            font-size: 16px;
            margin-bottom: 15px;
            color: #ffffff;
            border-bottom: 1px solid #1e3a5f;
            padding-bottom: 10px;
        }

        /* 通行通道控制 */
        .channel-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .channel-card {
            background-color: #18304a;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .channel-card:hover {
            background-color: #204060;
        }

        .channel-name {
            font-size: 14px;
            margin-bottom: 8px;
            color: #909399;
        }

        .channel-status {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status-open {
            color: #67c23a;
        }

        .status-closed {
            color: #f56c6c;
        }

        .channel-btn {
            width: 100%;
            padding: 6px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        /* 检测数据展示 */
        .detection-data {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .data-card {
            background-color: #10253b;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .data-title {
            font-size: 12px;
            color: #909399;
            margin-bottom: 8px;
        }

        .data-value {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 5px;
        }

        /* 人员与包裹绑定 */
        .binding-section {
            background-color: #10253b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .binding-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-size: 12px;
            color: #909399;
            margin-bottom: 5px;
        }

        .form-control {
            padding: 8px 12px;
            background-color: #18304a;
            border: 1px solid #1e3a5f;
            color: #ffffff;
            border-radius: 4px;
            font-size: 13px;
        }

        .form-control:focus {
            outline: none;
            border-color: #409eff;
        }

        /* 通行记录 */
        .passage-records {
            background-color: #10253b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .table-container {
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #1e3a5f;
            font-size: 13px;
        }

        .data-table th {
            background-color: #18304a;
            color: #909399;
            font-weight: normal;
        }

        .data-table td {
            color: #ffffff;
        }

        /* 操作按钮 */
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
            margin-right: 5px;
        }

        .btn-primary {
            background-color: #409eff;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #66b1ff;
        }

        .btn-danger {
            background-color: #f56c6c;
            color: #ffffff;
        }

        .btn-danger:hover {
            background-color: #f78989;
        }

        .btn-success {
            background-color: #67c23a;
            color: #ffffff;
        }

        .btn-success:hover {
            background-color: #85ce61;
        }

        .btn-secondary {
            background-color: #606266;
            color: #ffffff;
        }

        .btn-secondary:hover {
            background-color: #737579;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .passage-container {
                grid-template-columns: 1fr;
            }

            .binding-form {
                grid-template-columns: 1fr;
            }

            .channel-controls {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="page-header">
            <h1>通行管理</h1>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="dashboard.html">仪表盘</a>
                <a href="device.html">设备管理</a>
                <a href="events.html">事件中心</a>
                <a href="judge.html">集中判图</a>
                <a href="alarm.html">告警中心</a>
                <a href="analysis.html">统计分析</a>
                <a href="passage.html" class="active">通行管理</a>
                <a href="face.html">人脸识别</a>
                <a href="config.html">系统配置</a>
            </div>
        </div>

        <!-- 数据概览 -->
        <div class="detection-data">
            <div class="data-card">
                <div class="data-title">今日总通行</div>
                <div class="data-value" id="totalPassage">0</div>
            </div>
            <div class="data-card">
                <div class="data-title">体温异常</div>
                <div class="data-value" id="tempAbnormal">0</div>
            </div>
            <div class="data-card">
                <div class="data-title">违禁品检测</div>
                <div class="data-value" id="contrabandFound">0</div>
            </div>
            <div class="data-card">
                <div class="data-title">人脸未识别</div>
                <div class="data-value" id="faceUnidentified">0</div>
            </div>
        </div>

        <!-- 通行通道控制 -->
        <div class="control-panel">
            <div class="panel-title">通道状态与控制</div>
            <div class="channel-controls" id="channelControls"></div>
        </div>

        <!-- 人员与包裹绑定 -->
        <div class="binding-section">
            <div class="panel-title">人员与包裹绑定</div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <button class="btn btn-success" onclick="addNewBinding()">新增绑定</button>
            </div>
            <div class="binding-form">
                <div class="form-group">
                    <label class="form-label">人员ID</label>
                    <input type="text" class="form-control" id="passengerId" placeholder="请输入人员ID">
                </div>
                <div class="form-group">
                    <label class="form-label">包裹ID</label>
                    <input type="text" class="form-control" id="packageId" placeholder="请输入包裹ID">
                </div>
                <div class="form-group">
                    <label class="form-label">通道</label>
                    <select class="form-control" id="channelSelect">
                        <option value="channel1">1号通道</option>
                        <option value="channel2">2号通道</option>
                        <option value="channel3">3号通道</option>
                        <option value="channel4">4号通道</option>
                        <option value="channel5">5号通道</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">操作</label>
                    <button class="btn btn-primary" onclick="bindPassengerPackage()">绑定</button>
                    <button class="btn btn-secondary" onclick="unbindPassengerPackage()">解除绑定</button>
                </div>
            </div>
            <div class="table-container">
                <table class="data-table" id="bindingTable">
                    <thead>
                        <tr>
                            <th>人员ID</th>
                            <th>包裹ID</th>
                            <th>通道</th>
                            <th>绑定时间</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="bindingTableBody"></tbody>
                </table>
            </div>

            <!-- 绑定记录分页控制 -->
            <div class="pagination-controls"
                style="margin-top: 15px; padding: 15px 0; border-top: 1px solid #18304a; display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
                <div style="display: flex; align-items: center;">
                    <label for="bindingPageSizeSelect" style="color: #909399; margin-right: 8px;">每页显示:</label>
                    <select id="bindingPageSizeSelect" onchange="changePageSize('binding')"
                        style="padding: 4px 8px; background-color: #18304a; border: 1px solid #1e3a5f; color: #ffffff; border-radius: 4px; font-size: 12px;">
                        <option value="10">10条</option>
                        <option value="20" selected>20条</option>
                        <option value="30">30条</option>
                        <option value="50">50条</option>
                    </select>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button class="btn btn-secondary" onclick="goToPage('binding', 1)" id="bindingFirstPageBtn"
                        style="font-size: 12px; padding: 4px 8px;">首页</button>
                    <button class="btn btn-secondary"
                        onclick="goToPage('binding', window.pagination.binding.currentPage - 1)" id="bindingPrevPageBtn"
                        style="font-size: 12px; padding: 4px 8px;">上一页</button>
                    <span style="color: #ffffff;">第 <span id="bindingCurrentPageSpan">1</span>/<span
                            id="bindingTotalPagesSpan">1</span> 页</span>
                    <button class="btn btn-secondary"
                        onclick="goToPage('binding', window.pagination.binding.currentPage + 1)" id="bindingNextPageBtn"
                        style="font-size: 12px; padding: 4px 8px;">下一页</button>
                    <button class="btn btn-secondary"
                        onclick="goToPage('binding', window.pagination.binding.totalPages)" id="bindingLastPageBtn"
                        style="font-size: 12px; padding: 4px 8px;">末页</button>
                </div>
            </div>
        </div>

        <!-- 通行记录 -->
        <div class="passage-records">
            <div class="panel-title">最新通行记录</div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <button class="btn btn-success" onclick="addNewPassageRecord()">新增通行记录</button>
            </div>
            <div class="table-container">
                <table class="data-table" id="passageRecordsTable">
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>人员ID</th>
                            <th>包裹ID</th>
                            <th>体温</th>
                            <th>违禁品</th>
                            <th>通道</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="passageRecordsTableBody"></tbody>
                </table>
            </div>

            <!-- 通行记录分页控制 -->
            <div class="pagination-controls"
                style="margin-top: 15px; padding: 15px 0; border-top: 1px solid #18304a; display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
                <div style="display: flex; align-items: center;">
                    <label for="passagePageSizeSelect" style="color: #909399; margin-right: 8px;">每页显示:</label>
                    <select id="passagePageSizeSelect" onchange="changePageSize('passage')"
                        style="padding: 4px 8px; background-color: #18304a; border: 1px solid #1e3a5f; color: #ffffff; border-radius: 4px; font-size: 12px;">
                        <option value="10">10条</option>
                        <option value="20" selected>20条</option>
                        <option value="30">30条</option>
                        <option value="50">50条</option>
                    </select>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button class="btn btn-secondary" onclick="goToPage('passage', 1)" id="passageFirstPageBtn"
                        style="font-size: 12px; padding: 4px 8px;">首页</button>
                    <button class="btn btn-secondary"
                        onclick="goToPage('passage', window.pagination.passage.currentPage - 1)" id="passagePrevPageBtn"
                        style="font-size: 12px; padding: 4px 8px;">上一页</button>
                    <span style="color: #ffffff;">第 <span id="passageCurrentPageSpan">1</span>/<span
                            id="passageTotalPagesSpan">1</span> 页</span>
                    <button class="btn btn-secondary"
                        onclick="goToPage('passage', window.pagination.passage.currentPage + 1)" id="passageNextPageBtn"
                        style="font-size: 12px; padding: 4px 8px;">下一页</button>
                    <button class="btn btn-secondary"
                        onclick="goToPage('passage', window.pagination.passage.totalPages)" id="passageLastPageBtn"
                        style="font-size: 12px; padding: 4px 8px;">末页</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 模拟数据生成函数
        function generateMockData() {
            // 通道数据
            const channels = [
                { id: 'channel1', name: '1号通道', status: 'open', deviceId: 'DEV-101' },
                { id: 'channel2', name: '2号通道', status: 'open', deviceId: 'DEV-102' },
                { id: 'channel3', name: '3号通道', status: 'closed', deviceId: 'DEV-103' },
                { id: 'channel4', name: '4号通道', status: 'open', deviceId: 'DEV-104' },
                { id: 'channel5', name: '5号通道', status: 'open', deviceId: 'DEV-105' }
            ];

            // 绑定记录数据
            const bindingRecords = [];
            for (let i = 0; i < 10; i++) {
                const time = new Date(Date.now() - Math.random() * 3600000);
                const status = Math.random() > 0.7 ? '已完成' : (Math.random() > 0.5 ? '通行中' : '待通行');
                bindingRecords.push({
                    id: `BIND-${Date.now()}-${i}`,
                    passengerId: `PASS-${Math.floor(Math.random() * 10000)}`,
                    packageId: `PKG-${Date.now()}-${i}`,
                    channel: `channel${Math.floor(Math.random() * 5) + 1}`,
                    bindTime: time.toLocaleString(),
                    status: status
                });
            }

            // 通行记录数据
            const passageRecords = [];
            for (let i = 0; i < 15; i++) {
                const time = new Date(Date.now() - Math.random() * 86400000);
                const temp = (Math.random() * 2 + 36).toFixed(1);
                const isContraband = Math.random() > 0.9;
                const status = isContraband || parseFloat(temp) > 37.3 ? '拒绝通行' : '允许通行';
                passageRecords.push({
                    id: `PASS-${Date.now()}-${i}`,
                    time: time.toLocaleString(),
                    passengerId: `PASS-${Math.floor(Math.random() * 10000)}`,
                    packageId: `PKG-${Date.now()}-${i}`,
                    temperature: temp,
                    contraband: isContraband ? ['刀具', '液体', '电池', '其他'][Math.floor(Math.random() * 4)] : '无',
                    channel: `channel${Math.floor(Math.random() * 5) + 1}`,
                    status: status
                });
            }

            // 统计数据
            const stats = {
                totalPassage: Math.floor(Math.random() * 5000) + 1000,
                tempAbnormal: Math.floor(Math.random() * 50) + 5,
                contrabandFound: Math.floor(Math.random() * 100) + 10,
                faceUnidentified: Math.floor(Math.random() * 200) + 20
            };

            return { channels, bindingRecords, passageRecords, stats };
        }

        // 全局数据变量
        let mockData = {};

        // 分页配置
        window.pagination = {
            binding: { currentPage: 1, pageSize: 20, totalPages: 1 },
            passage: { currentPage: 1, pageSize: 20, totalPages: 1 }
        };

        // 初始化页面
        function initPage() {
            // 生成模拟数据
            mockData = generateMockData();

            // 初始化分页
            calculateTotalPages('binding');
            calculateTotalPages('passage');

            // 渲染数据
            renderStats();
            renderChannelControls();
            renderPagedBindingRecords();
            renderPagedPassageRecords();

            // 更新分页UI
            updatePaginationUI('binding');
            updatePaginationUI('passage');

            // 启动实时数据更新
            setInterval(updateRealTimeData, 3000);
        }

        // 渲染统计数据
        function renderStats() {
            document.getElementById('totalPassage').textContent = mockData.stats.totalPassage;
            document.getElementById('tempAbnormal').textContent = mockData.stats.tempAbnormal;
            document.getElementById('contrabandFound').textContent = mockData.stats.contrabandFound;
            document.getElementById('faceUnidentified').textContent = mockData.stats.faceUnidentified;
        }

        // 渲染通道控制
        function renderChannelControls() {
            const container = document.getElementById('channelControls');
            container.innerHTML = '';

            mockData.channels.forEach(channel => {
                const channelCard = document.createElement('div');
                channelCard.className = 'channel-card';

                const statusText = channel.status === 'open' ? '开启' : '关闭';
                const statusClass = channel.status === 'open' ? 'status-open' : 'status-closed';
                const btnText = channel.status === 'open' ? '关闭' : '开启';
                const btnClass = channel.status === 'open' ? 'btn-danger' : 'btn-success';

                channelCard.innerHTML = `
                    <div class="channel-name">${channel.name}</div>
                    <div class="channel-status ${statusClass}">${statusText}</div>
                    <button class="channel-btn ${btnClass}" onclick="toggleChannel('${channel.id}')">${btnText}</button>
                `;

                container.appendChild(channelCard);
            });
        }

        // 新增绑定
        function addNewBinding() {
            // 这里可以实现新增绑定的逻辑
            alert('新增绑定功能开发中...');
        }

        // 新增通行记录
        function addNewPassageRecord() {
            // 这里可以实现新增通行记录的逻辑
            alert('新增通行记录功能开发中...');
        }

        // 计算总页数
        function calculateTotalPages(type) {
            const data = mockData[type + (type === 'passage' ? 'Records' : 'Records')];
            if (!data) return;

            const pagination = window.pagination[type];
            pagination.totalPages = Math.ceil(data.length / pagination.pageSize);
            if (pagination.totalPages < 1) {
                pagination.totalPages = 1;
            }
        }

        // 渲染绑定记录（支持分页）
        function renderBindingRecords(records) {
            const tbody = document.getElementById('bindingTableBody');
            tbody.innerHTML = '';

            records.forEach(record => {
                const channel = mockData.channels.find(c => c.id === record.channel);
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${record.passengerId}</td>
                    <td>${record.packageId}</td>
                    <td>${channel ? channel.name : '未知通道'}</td>
                    <td>${record.bindTime}</td>
                    <td>${record.status}</td>
                    <td>
                        <button class="btn btn-secondary" onclick="viewBindingDetail('${record.id}')">查看</button>
                        <button class="btn btn-danger" onclick="unbindPassengerPackage('${record.id}')">解除绑定</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // 渲染分页绑定记录
        function renderPagedBindingRecords() {
            const pagination = window.pagination.binding;
            const startIndex = (pagination.currentPage - 1) * pagination.pageSize;
            const endIndex = startIndex + pagination.pageSize;
            const pagedData = mockData.bindingRecords.slice(startIndex, endIndex);

            renderBindingRecords(pagedData);
        }

        // 渲染通行记录（支持分页）
        function renderPassageRecords(records) {
            const tbody = document.getElementById('passageRecordsTableBody');
            tbody.innerHTML = '';

            records.forEach(record => {
                const channel = mockData.channels.find(c => c.id === record.channel);
                const statusClass = record.status === '允许通行' ? 'btn-success' : 'btn-danger';
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${record.time}</td>
                    <td>${record.passengerId}</td>
                    <td>${record.packageId}</td>
                    <td>${record.temperature}°C</td>
                    <td>${record.contraband}</td>
                    <td>${channel ? channel.name : '未知通道'}</td>
                    <td><span class="btn ${statusClass}">${record.status}</span></td>
                    <td>
                        <button class="btn btn-secondary" onclick="viewPassageDetail('${record.id}')">查看</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // 渲染分页通行记录
        function renderPagedPassageRecords() {
            const pagination = window.pagination.passage;
            const startIndex = (pagination.currentPage - 1) * pagination.pageSize;
            const endIndex = startIndex + pagination.pageSize;
            const pagedData = mockData.passageRecords.slice(startIndex, endIndex);

            renderPassageRecords(pagedData);
        }

        // 切换通道状态
        function toggleChannel(channelId) {
            const channel = mockData.channels.find(c => c.id === channelId);
            if (channel) {
                channel.status = channel.status === 'open' ? 'closed' : 'open';
                renderChannelControls();
                updateEventLog(channel.name, channel.status === 'open' ? '开启通道' : '关闭通道');
            }
        }

        // 绑定人员与包裹
        function bindPassengerPackage() {
            const passengerId = document.getElementById('passengerId').value;
            const packageId = document.getElementById('packageId').value;
            const channelId = document.getElementById('channelSelect').value;

            if (!passengerId || !packageId) {
                alert('请填写人员ID和包裹ID');
                return;
            }

            const newBinding = {
                id: `BIND-${Date.now()}`,
                passengerId: passengerId,
                packageId: packageId,
                channel: channelId,
                bindTime: new Date().toLocaleString(),
                status: '待通行'
            };

            mockData.bindingRecords.unshift(newBinding);
            renderBindingRecords();

            // 清空表单
            document.getElementById('passengerId').value = '';
            document.getElementById('packageId').value = '';

            updateEventLog('系统', `绑定人员 ${passengerId} 与包裹 ${packageId}`);
        }

        // 解除绑定
        function unbindPassengerPackage(recordId) {
            if (recordId) {
                mockData.bindingRecords = mockData.bindingRecords.filter(r => r.id !== recordId);
            } else {
                const passengerId = document.getElementById('passengerId').value;
                const packageId = document.getElementById('packageId').value;
                if (passengerId) {
                    mockData.bindingRecords = mockData.bindingRecords.filter(r => r.passengerId !== passengerId);
                }
                if (packageId) {
                    mockData.bindingRecords = mockData.bindingRecords.filter(r => r.packageId !== packageId);
                }
            }
            renderBindingRecords();
            updateEventLog('系统', '解除人员与包裹绑定');
        }

        // 查看绑定详情
        function viewBindingDetail(recordId) {
            const record = mockData.bindingRecords.find(r => r.id === recordId);
            if (record) {
                alert(`绑定详情：\nID: ${record.id}\n人员ID: ${record.passengerId}\n包裹ID: ${record.packageId}\n通道: ${record.channel}\n绑定时间: ${record.bindTime}\n状态: ${record.status}`);
            }
        }

        // 查看通行详情
        function viewPassageDetail(recordId) {
            const record = mockData.passageRecords.find(r => r.id === recordId);
            if (record) {
                alert(`通行详情：\nID: ${record.id}\n时间: ${record.time}\n人员ID: ${record.passengerId}\n包裹ID: ${record.packageId}\n体温: ${record.temperature}°C\n违禁品: ${record.contraband}\n通道: ${record.channel}\n状态: ${record.status}`);
            }
        }

        // 更新事件日志
        function updateEventLog(source, action) {
            console.log(`[${new Date().toLocaleString()}] ${source}: ${action}`);
        }

        // 更新实时数据
        function updateRealTimeData() {
            // 随机更新统计数据
            mockData.stats.totalPassage += Math.floor(Math.random() * 10) + 1;
            if (Math.random() > 0.95) {
                mockData.stats.tempAbnormal += 1;
            }
            if (Math.random() > 0.98) {
                mockData.stats.contrabandFound += 1;
            }
            if (Math.random() > 0.9) {
                mockData.stats.faceUnidentified += 1;
            }

            // 更新统计数据显示
            renderStats();

            // 随机添加新的通行记录
            if (Math.random() > 0.8) {
                const time = new Date();
                const temp = (Math.random() * 2 + 36).toFixed(1);
                const isContraband = Math.random() > 0.95;
                const status = isContraband || parseFloat(temp) > 37.3 ? '拒绝通行' : '允许通行';
                const newRecord = {
                    id: `PASS-${Date.now()}`,
                    time: time.toLocaleString(),
                    passengerId: `PASS-${Math.floor(Math.random() * 10000)}`,
                    packageId: `PKG-${Date.now()}`,
                    temperature: temp,
                    contraband: isContraband ? ['刀具', '液体', '电池', '其他'][Math.floor(Math.random() * 4)] : '无',
                    channel: `channel${Math.floor(Math.random() * 5) + 1}`,
                    status: status
                };

                mockData.passageRecords.unshift(newRecord);
                // 重新计算总页数
                calculateTotalPages('passage');
                // 更新分页UI
                updatePaginationUI('passage');
                // 渲染分页数据
                renderPagedPassageRecords();
            }
        }

        // 更新分页UI
        function updatePaginationUI(type) {
            const pagination = window.pagination[type];
            const container = type === 'binding' ? document.getElementById('bindingTableBody').parentElement.nextElementSibling : document.getElementById('passageRecordsTableBody').parentElement.nextElementSibling;

            if (container) {
                // 更新当前页码显示
                const currentPageSpan = document.getElementById(`${type}CurrentPageSpan`);
                const totalPagesSpan = document.getElementById(`${type}TotalPagesSpan`);
                if (currentPageSpan && totalPagesSpan) {
                    currentPageSpan.textContent = pagination.currentPage;
                    totalPagesSpan.textContent = pagination.totalPages;
                }

                // 启用/禁用按钮
                const firstPageBtn = document.getElementById(`${type}FirstPageBtn`);
                const prevPageBtn = document.getElementById(`${type}PrevPageBtn`);
                const nextPageBtn = document.getElementById(`${type}NextPageBtn`);
                const lastPageBtn = document.getElementById(`${type}LastPageBtn`);

                if (firstPageBtn && prevPageBtn) {
                    firstPageBtn.disabled = pagination.currentPage === 1;
                    prevPageBtn.disabled = pagination.currentPage === 1;
                }

                if (nextPageBtn && lastPageBtn) {
                    nextPageBtn.disabled = pagination.currentPage === pagination.totalPages;
                    lastPageBtn.disabled = pagination.currentPage === pagination.totalPages;
                }
            }
        }

        // 改变每页显示数量
        function changePageSize(type) {
            const selectElement = document.getElementById(`${type}PageSizeSelect`);
            if (selectElement) {
                window.pagination[type].pageSize = parseInt(selectElement.value);
                window.pagination[type].currentPage = 1;

                // 重新计算总页数
                calculateTotalPages(type);

                // 更新分页UI
                updatePaginationUI(type);

                // 渲染分页数据
                if (type === 'binding') {
                    renderPagedBindingRecords();
                } else {
                    renderPagedPassageRecords();
                }
            }
        }

        // 跳转到指定页面
        function goToPage(type, pageNum) {
            const pagination = window.pagination[type];

            if (pageNum < 1 || pageNum > pagination.totalPages) {
                return;
            }

            pagination.currentPage = pageNum;

            // 更新分页UI
            updatePaginationUI(type);

            // 渲染分页数据
            if (type === 'binding') {
                renderPagedBindingRecords();
            } else {
                renderPagedPassageRecords();
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>

</html>
