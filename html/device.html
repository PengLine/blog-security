<div class="module" id="device">
    <div class="filter-bar">
        <div class="filter-group">
            <span class="filter-label">设备类型：</span>
            <select class="form-control" id="devTypeFilter">
                <option value="">全部</option>
                <option value="security">核心安检设备</option>
                <option value="door">安检门</option>
                <option value="access">明眸设备</option>
                <option value="detection">探测设备</option>
            </select>
        </div>
        <div class="filter-group">
            <span class="filter-label">设备状态：</span>
            <select class="form-control" id="devStatusFilter">
                <option value="">全部</option>
                <option value="online">在线</option>
                <option value="offline">离线</option>
                <option value="warning">告警</option>
            </select>
        </div>
        <div class="filter-group">
            <span class="filter-label">关键词：</span>
            <input type="text" class="form-control" id="devKeyword" placeholder="设备名称 / ID / 通道">
        </div>
        <div class="filter-group">
            <button class="btn btn-primary" id="devSearchBtn">搜索</button>
            <button class="btn btn-secondary" id="devResetBtn">重置</button>
        </div>
    </div>

    <div class="device-detail">
        <div class="detail-panel">
            <div class="detail-title">设备概览</div>
            <div id="devOverviewPanel">
                <!-- 概览由JS动态生成 -->
            </div>
        </div>
        <div class="detail-panel">
            <div class="detail-title">设备类型分布</div>
            <div id="devCategoryPanel">
                <!-- 分布由JS动态生成 -->
            </div>
        </div>
    </div>

    <div id="deviceDetailPanel"></div>

    <div class="table-section">
        <div class="table-title">设备列表</div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>设备ID</th>
                    <th>设备名称</th>
                    <th>设备类型</th>
                    <th>IP地址</th>
                    <th>状态</th>
                    <th>位置</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="deviceTableBody">
                <!-- 设备列表将通过JavaScript动态生成 -->
            </tbody>
        </table>
    </div>
</div>
