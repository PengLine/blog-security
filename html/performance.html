<div class="module" id="performance">
    <div class="module-header">
        <h2>判图员绩效榜（今日）</h2>
        <div class="module-actions">
            <button class="btn btn-secondary" id="perfExportBtn">导出考核表</button>
        </div>
    </div>

    <div class="rank-grid" id="perfRankCards">
        <!-- 前三甲卡片由 JS 渲染 -->
    </div>

    <div class="charts-section">
        <div class="chart-container">
            <h3>判图量对比</h3>
            <div class="situation-chart" id="perfJudgeChart"></div>
        </div>
        <div class="chart-container">
            <h3>查获违禁对比</h3>
            <div class="situation-chart" id="perfDangerChart"></div>
        </div>
    </div>

    <div class="table-section">
        <div class="table-title">考核明细（点击查看该判图员作业记录）</div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>判图员</th>
                    <th>班次状态</th>
                    <th>判图量</th>
                    <th>查获违禁</th>
                    <th>可疑转检</th>
                    <th>平均响应</th>
                    <th>质控抽检</th>
                    <th>漏判</th>
                    <th>抽检准确率</th>
                    <th>综合评分</th>
                </tr>
            </thead>
            <tbody id="perfTableBody"></tbody>
        </table>
    </div>

    <p style="font-size:12px;color:#909399;margin-top:10px;">
        评分规则：基础分 88 + 查获贡献（每件 +0.4，封顶另计）- 抽检漏判（每起 -6）- 处置不规范（每起 -2）+ 工作量加成（≤6）- 响应超时惩罚（平均超 30 分钟起扣，≤4）。
        质控抽检由复检室对已判包裹按约 12% 比例回溯核验。
    </p>
</div>
