<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>统计分析 - 智慧安检系统</title>
    <link rel="stylesheet" href="/css/hexo-common.css">
    <link rel="stylesheet" href="/css/hexo-full-screen.css">
    <link rel="stylesheet" href="/css/hidden-div.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="module" id="analysis">
        <div class="module-header">
            <h2>统计分析</h2>
            <div class="module-actions">
                <div class="filter-group">
                    <label>时间范围：</label>
                    <select id="timeRangeFilter">
                        <option value="day">今日</option>
                        <option value="week">本周</option>
                        <option value="month">本月</option>
                        <option value="year">本年</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="refreshBtn">刷新数据</button>
                <button class="btn btn-secondary" id="exportBtn">导出报表</button>
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-content">
                    <h3>总客流</h3>
                    <div class="stat-value" id="totalPassenger">0</div>
                    <div class="stat-trend">
                        <span class="trend-up">+12.5%</span>
                        <span>较昨日</span>
                    </div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-content">
                    <h3>违禁品数量</h3>
                    <div class="stat-value" id="totalContraband">0</div>
                    <div class="stat-trend">
                        <span class="trend-down">-3.2%</span>
                        <span>较昨日</span>
                    </div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-content">
                    <h3>设备在线率</h3>
                    <div class="stat-value" id="deviceOnlineRate">0%</div>
                    <div class="stat-trend">
                        <span class="trend-up">+0.5%</span>
                        <span>较昨日</span>
                    </div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-content">
                    <h3>事件处理率</h3>
                    <div class="stat-value" id="eventProcessRate">0%</div>
                    <div class="stat-trend">
                        <span class="trend-up">+2.1%</span>
                        <span>较昨日</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="charts-section">
            <div class="chart-container">
                <h3>客流趋势</h3>
                <canvas id="passengerChart" width="400" height="200"></canvas>
            </div>
            <div class="chart-container">
                <h3>违禁品分类</h3>
                <canvas id="contrabandChart" width="400" height="200"></canvas>
            </div>
            <div class="chart-container">
                <h3>设备状态分布</h3>
                <canvas id="deviceStatusChart" width="400" height="200"></canvas>
            </div>
            <div class="chart-container">
                <h3>事件类型统计</h3>
                <canvas id="eventTypeChart" width="400" height="200"></canvas>
            </div>
        </div>
        
        <div class="analysis-table">
            <h3>详细统计数据</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>客流</th>
                        <th>违禁品数量</th>
                        <th>告警数量</th>
                        <th>设备在线数</th>
                    </tr>
                </thead>
                <tbody id="analysisTableBody">
                    <!-- 详细数据将通过JavaScript动态加载 -->
                </tbody>
            </table>
        </div>
    </div>
    
    <script type="module" src="../js/analysis.js"></script>
</body>
</html>
