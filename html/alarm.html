<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>告警中心 - 智慧安检系统</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="module" id="alarm">
        <div class="module-header">
            <h2>告警中心</h2>
            <div class="module-actions">
                <div class="filter-group">
                    <label>告警级别：</label>
                    <select id="alarmLevelFilter">
                        <option value="">全部</option>
                        <option value="danger">危险</option>
                        <option value="warning">警告</option>
                        <option value="info">信息</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>处理状态：</label>
                    <select id="alarmStatusFilter">
                        <option value="">全部</option>
                        <option value="已处理">已处理</option>
                        <option value="未处理">未处理</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="filterBtn">筛选</button>
                <button class="btn btn-secondary" id="resetBtn">重置</button>
                <button class="btn btn-danger" id="batchHandleBtn">批量处理</button>
            </div>
        </div>
        
        <div class="alarm-stats">
            <div class="alarm-stat-item">
                <div class="alarm-stat-count" id="totalAlarms">0</div>
                <div class="alarm-stat-label">总告警数</div>
            </div>
            <div class="alarm-stat-item">
                <div class="alarm-stat-count alarm-danger" id="dangerAlarms">0</div>
                <div class="alarm-stat-label">危险告警</div>
            </div>
            <div class="alarm-stat-item">
                <div class="alarm-stat-count alarm-warning" id="warningAlarms">0</div>
                <div class="alarm-stat-label">警告告警</div>
            </div>
            <div class="alarm-stat-item">
                <div class="alarm-stat-count alarm-info" id="infoAlarms">0</div>
                <div class="alarm-stat-label">信息告警</div>
            </div>
            <div class="alarm-stat-item">
                <div class="alarm-stat-count" id="unhandledAlarms">0</div>
                <div class="alarm-stat-label">未处理告警</div>
            </div>
        </div>
        
        <div class="alarms-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectAllAlarms"></th>
                        <th>告警ID</th>
                        <th>告警时间</th>
                        <th>告警设备</th>
                        <th>告警级别</th>
                        <th>告警内容</th>
                        <th>处理状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="alarmsTableBody">
                    <!-- 告警列表将通过JavaScript动态加载 -->
                </tbody>
            </table>
        </div>
        
        <div class="pagination-page">
            <button class="btn btn-secondary">上一页</button>
            <span class="page-info">第 1 页，共 3 页</span>
            <button class="btn btn-secondary">下一页</button>
        </div>
    </div>
    
    <script type="module" src="../js/alarm.js"></script>
</body>
</html>
