<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配置管理 - 智慧安检系统</title>
    <link rel="stylesheet" href="/css/hexo-common.css">
    <link rel="stylesheet" href="/css/hexo-full-screen.css">
    <link rel="stylesheet" href="/css/hidden-div.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="module" id="config">
        <div class="module-header">
            <h2>配置管理</h2>
            <div class="module-actions">
                <button class="btn btn-primary">新增配置</button>
                <button class="btn btn-secondary">批量导入</button>
                <button class="btn btn-secondary">批量导出</button>
            </div>
        </div>
        
        <div class="filter-bar">
            <div class="filter-group">
                <label>配置类型：</label>
                <select id="configTypeFilter">
                    <option value="">全部</option>
                    <option value="device">设备配置</option>
                    <option value="event">事件配置</option>
                    <option value="system">系统配置</option>
                </select>
            </div>
            <div class="filter-group">
                <label>配置名称：</label>
                <input type="text" id="configNameFilter" placeholder="输入配置名称">
            </div>
            <div class="filter-group">
                <button class="btn btn-primary" id="filterBtn">筛选</button>
                <button class="btn btn-secondary" id="resetBtn">重置</button>
            </div>
        </div>
        
        <div class="configs-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>配置ID</th>
                        <th>配置名称</th>
                        <th>配置类型</th>
                        <th>创建时间</th>
                        <th>更新时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="configsTableBody">
                    <!-- 配置列表将通过JavaScript动态加载 -->
                </tbody>
            </table>
        </div>
        
        <div class="pagination-page">
            <button class="btn btn-secondary">上一页</button>
            <span class="page-info">第 1 页，共 5 页</span>
            <button class="btn btn-secondary">下一页</button>
        </div>
    </div>
    
    <script type="module" src="../js/config.js"></script>
</body>
</html>
