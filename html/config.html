<div class="module" id="config">
    <div class="module-header">
        <h2>配置管理</h2>
        <div class="module-actions">
            <button class="btn btn-primary">新增配置</button>
            <button class="btn btn-secondary">批量导入</button>
            <button class="btn btn-secondary">批量导出</button>
        </div>
    </div>
    
    <div class="filter-bar">
        <div class="filter-group">
            <label class="filter-label">配置类型：</label>
            <select id="configTypeFilter" class="form-control">
                <option value="">全部</option>
                <option value="device">设备配置</option>
                <option value="event">事件配置</option>
                <option value="system">系统配置</option>
            </select>
        </div>
        <div class="filter-group">
            <label class="filter-label">配置名称：</label>
            <input type="text" class="form-control" id="configNameFilter" placeholder="输入配置名称">
        </div>
        <div class="filter-group">
            <button class="btn btn-primary" id="filterBtn">筛选</button>
            <button class="btn btn-secondary" id="resetBtn">重置</button>
        </div>
    </div>
    
    <div class="table-section">
        <table class="data-table">
            <thead>
                <tr>
                    <th>配置ID</th>
                    <th>配置名称</th>
                    <th>配置类型</th>
                    <th>创建时间</th>
                    <th>更新时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="configsTableBody">
                <!-- 配置列表将通过JavaScript动态加载 -->
            </tbody>
        </table>
    </div>
</div>
