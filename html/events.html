<div class="module" id="events">
    <div class="filter-bar">
        <div class="filter-group">
            <span class="filter-label">事件类型：</span>
            <select class="form-control" id="eventTypeFilter">
                <option value="">全部</option>
                <option value="正常通过">正常通过</option>
                <option value="金属检测">金属检测</option>
                <option value="违禁品检测">违禁品检测</option>
                <option value="包裹异常">包裹异常</option>
                <option value="集中判图">集中判图</option>
                <option value="温度异常">温度异常</option>
                <option value="未刷脸">未刷脸</option>
                <option value="未注册">未注册</option>
                <option value="设备离线">设备离线</option>
                <option value="网络异常">网络异常</option>
            </select>
        </div>
        <div class="filter-group">
            <span class="filter-label">事件状态：</span>
            <select class="form-control" id="eventStatusFilter">
                <option value="">全部</option>
                <option value="status-normal">正常</option>
                <option value="status-warning">警告</option>
                <option value="status-danger">危险</option>
                <option value="status-processing">处理中</option>
            </select>
        </div>
        <div class="filter-group">
            <span class="filter-label">处理状态：</span>
            <select class="form-control" id="eventProcessFilter">
                <option value="">全部</option>
                <option value="未处理">未处理</option>
                <option value="处理中">处理中</option>
                <option value="已处理">已处理</option>
            </select>
        </div>
        <div class="filter-group">
            <span class="filter-label">关键字：</span>
            <input type="text" class="form-control" id="eventKeyword" placeholder="设备 / 详情 / 事件ID" style="width:200px;">
        </div>
        <div class="filter-group">
            <button class="btn btn-primary" id="eventSearchBtn">查询</button>
            <button class="btn btn-secondary" id="eventExportBtn">导出</button>
        </div>
    </div>

    <div class="table-section">
        <div class="table-title">事件列表</div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>事件ID</th>
                    <th>时间</th>
                    <th>设备</th>
                    <th>事件类型</th>
                    <th>状态</th>
                    <th>详情</th>
                    <th>处理状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="eventsTableBody">
                <!-- 事件列表将通过JavaScript动态生成 -->
            </tbody>
        </table>
    </div>
</div>
