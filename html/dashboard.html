<div class="flow-bar" id="bizFlowBar">
    <!-- 业务链路流程条（点击可跳转对应模块） -->
</div>

<div class="dash-view-bar">
    <div class="dash-views" id="dashViews"></div>
    <div class="dash-quick" id="dashQuick"></div>
</div>

<div class="sub-title" style="margin-top:6px;">异常聚合（跨模块统一口径，点击直达处置页）</div>
<div class="principle-grid" id="dashAlerts"></div>

<div class="stats-grid" id="statsGrid">
    <!-- 统计卡片按值班视角动态生成 -->
</div>

<div class="table-section">
    <div class="table-title">
        <span id="dashTrendLabel">同期对比</span>
        <span style="font-size: 12px; color: #909399;">昨日 / 上周按已过时段比例折算，保持与今日同口径</span>
    </div>
    <table class="data-table">
        <thead>
            <tr>
                <th style="width: 140px;">指标</th>
                <th>今日实时</th>
                <th>昨日同时段</th>
                <th>上周同日</th>
                <th style="width: 160px;">环比（较昨日）</th>
            </tr>
        </thead>
        <tbody id="dashTrendBody"></tbody>
    </table>
</div>

<div class="charts-section">
    <div class="chart-container">
        <div class="chart-title">今日过检趋势</div>
        <div class="situation-chart" id="passengerFlowChart"></div>
    </div>
    <div class="chart-container">
        <div class="chart-title">违禁品查获分类</div>
        <div class="situation-chart" id="contrabandChart"></div>
    </div>
</div>

<div class="table-section">
    <div class="table-title" style="display: flex; justify-content: space-between; align-items: center;">
        <span>最新事件（实时联动判图/处置业务）</span>
        <span style="font-size: 12px; color: #909399;" id="dashRefreshTip">每 30 秒自动刷新</span>
    </div>
    <table class="data-table" id="eventsTable">
        <thead>
            <tr>
                <th>时间</th>
                <th>设备</th>
                <th>事件类型</th>
                <th>状态</th>
                <th>详情</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <!-- 事件列表将通过JavaScript动态生成 -->
        </tbody>
    </table>
</div>
