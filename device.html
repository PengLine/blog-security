<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧安检系统 - 设备管理</title>

    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 主容器样式 */
        .container {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #0a1929;
            color: #ffffff;
            overflow-x: hidden;
            margin: 0 auto;
            padding: 20px;
        }

        .page-header {
            background-color: #10253b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .page-header h1 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #909399;
            padding: 8px 16px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background-color: #18304a;
            color: #ffffff;
        }

        .nav-links a.active {
            background-color: #18304a;
            color: #409eff;
        }

        /* 模块容器 */
        .module {
            padding: 20px;
        }

        /* 设备分类 */
        .device-categories {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: 8px 16px;
            background-color: #10253b;
            border: 1px solid #1e3a5f;
            border-radius: 4px;
            color: #909399;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .category-btn:hover {
            background-color: #18304a;
            color: #ffffff;
        }

        .category-btn.active {
            background-color: #18304a;
            color: #409eff;
            border-color: #409eff;
        }

        /* 数据表格 */
        .table-section {
            background-color: #10253b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .table-title {
            font-size: 16px;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #1e3a5f;
            font-size: 13px;
        }

        .data-table th {
            background-color: #18304a;
            color: #909399;
            font-weight: normal;
        }

        .data-table td {
            color: #ffffff;
        }

        /* 状态标签 */
        .status-tag {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            text-align: center;
        }

        .status-normal {
            background-color: #67c23a;
            color: #ffffff;
        }

        .status-warning {
            background-color: #e6a23c;
            color: #ffffff;
        }

        .status-danger {
            background-color: #f56c6c;
            color: #ffffff;
        }

        /* 操作按钮 */
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
            margin-right: 5px;
        }

        .btn-primary {
            background-color: #409eff;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #66b1ff;
        }

        .btn-secondary {
            background-color: #606266;
            color: #ffffff;
        }

        .btn-secondary:hover {
            background-color: #737579;
        }

        /* 设备详情面板 */
        .device-detail-panel {
            background-color: #10253b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .detail-title {
            font-size: 16px;
            margin-bottom: 15px;
            color: #ffffff;
            border-bottom: 1px solid #1e3a5f;
            padding-bottom: 10px;
        }

        .device-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .detail-panel {
            background-color: #18304a;
            padding: 20px;
            border-radius: 8px;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #1e3a5f;
            font-size: 13px;
        }

        .detail-label {
            color: #909399;
        }

        .detail-value {
            color: #ffffff;
            font-weight: 500;
        }

        /* 响应式设计 */
        @media (max-width: 1200px) {
            .device-detail {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .main-nav {
                display: none;
            }

            .device-categories {
                flex-direction: column;
            }

            /* 表格优化 */
            .data-table {
                font-size: 12px;
            }

            .data-table th,
            .data-table td {
                padding: 8px 5px;
            }
        }

        @media (max-width: 576px) {
            .logo {
                font-size: 20px;
            }

            .system-info {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="page-header">
            <h1>设备管理</h1>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="dashboard.html">仪表盘</a>
                <a href="device.html" class="active">设备管理</a>
                <a href="events.html">事件中心</a>
                <a href="judge.html">集中判图</a>
                <a href="alarm.html">告警中心</a>
                <a href="analysis.html">统计分析</a>
                <a href="passage.html">通行管理</a>
                <a href="face.html">人脸识别</a>
                <a href="config.html">系统配置</a>
            </div>
        </div>

        <!-- 设备管理模块 -->
        <div class="module" id="device">
            <!-- 设备分类筛选 -->
            <div class="device-categories" id="deviceCategories">
                <button class="category-btn active" data-category="all">全部设备</button>
                <button class="category-btn" data-category="security">安检设备</button>
                <button class="category-btn" data-category="access">门禁设备</button>
                <button class="category-btn" data-category="detection">探测设备</button>
            </div>

            <!-- 设备详情面板 -->
            <div class="device-detail-panel" id="deviceDetailPanel" style="display: none;">
                <div class="detail-title">设备详情</div>
                <div class="device-detail" id="deviceDetailContent"></div>
            </div>

            <!-- 设备列表 -->
            <div class="table-section">
                <div class="table-title">设备列表</div>
                <table class="data-table" id="devicesTable">
                    <thead>
                        <tr>
                            <th>设备ID</th>
                            <th>设备名称</th>
                            <th>设备类型</th>
                            <th>IP地址</th>
                            <th>状态</th>
                            <th>位置</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="devicesTableBody"></tbody>
                </table>

                <!-- 分页控制 -->
                <div class="pagination-controls"
                    style="margin-top: 15px; padding: 15px 0; border-top: 1px solid #1e3a5f; display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
                    <div style="display: flex; align-items: center;">
                        <label for="devicesPageSizeSelect" style="color: #909399; margin-right: 8px;">每页显示:</label>
                        <select id="devicesPageSizeSelect" onchange="changeDevicesPageSize()"
                            style="padding: 4px 8px; background-color: #18304a; border: 1px solid #1e3a5f; color: #ffffff; border-radius: 4px; font-size: 12px;">
                            <option value="10">10条</option>
                            <option value="20" selected>20条</option>
                            <option value="30">30条</option>
                            <option value="50">50条</option>
                        </select>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <button class="btn btn-secondary" onclick="goToDevicesPage(1)" id="devicesFirstPageBtn"
                            style="font-size: 12px; padding: 4px 8px;">首页</button>
                        <button class="btn btn-secondary" onclick="goToDevicesPage(window.devicesCurrentPage - 1)"
                            id="devicesPrevPageBtn" style="font-size: 12px; padding: 4px 8px;">上一页</button>
                        <span style="color: #ffffff;">第 <span id="devicesCurrentPageSpan">1</span>/<span
                                id="devicesTotalPagesSpan">1</span> 页</span>
                        <button class="btn btn-secondary" onclick="goToDevicesPage(window.devicesCurrentPage + 1)"
                            id="devicesNextPageBtn" style="font-size: 12px; padding: 4px 8px;">下一页</button>
                        <button class="btn btn-secondary" onclick="goToDevicesPage(window.devicesTotalPages)"
                            id="devicesLastPageBtn" style="font-size: 12px; padding: 4px 8px;">末页</button>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // 模拟数据生成函数
            function generateMockData() {
                // 设备列表数据
                const devices = [
                    { id: "DEV-1001", name: "安检机001", type: "security", ip: "192.168.1.101", status: "online", location: "1号通道", model: "X-Ray-500", firmware: "v1.2.3", onlineTime: "2026-01-16 08:30:00", lastMaintenance: "2025-12-20" },
                    { id: "DEV-1002", name: "复检台001", type: "security", ip: "192.168.1.102", status: "online", location: "2号通道", model: "Recheck-200", firmware: "v1.1.5", onlineTime: "2026-01-16 08:35:00", lastMaintenance: "2025-12-25" },
                    { id: "DEV-1003", name: "金属门001", type: "access", ip: "192.168.1.103", status: "online", location: "3号通道", model: "Metal-Door-3000", firmware: "v2.0.1", onlineTime: "2026-01-16 08:40:00", lastMaintenance: "2025-12-18" },
                    { id: "DEV-1004", name: "毫米波门001", type: "access", ip: "192.168.1.104", status: "warning", location: "4号通道", model: "MMW-Door-5000", firmware: "v2.1.0", onlineTime: "2026-01-16 08:45:00", lastMaintenance: "2025-12-15" },
                    { id: "DEV-1005", name: "防损门001", type: "access", ip: "192.168.1.105", status: "online", location: "5号通道", model: "AntiTheft-1000", firmware: "v1.5.2", onlineTime: "2026-01-16 08:50:00", lastMaintenance: "2025-12-22" },
                    { id: "DEV-1006", name: "分类门001", type: "access", ip: "192.168.1.106", status: "offline", location: "6号通道", model: "Classify-2000", firmware: "v1.3.0", onlineTime: "2026-01-16 08:25:00", lastMaintenance: "2025-12-30" },
                    { id: "DEV-1007", name: "门禁设备001", type: "access", ip: "192.168.1.107", status: "online", location: "7号通道", model: "Access-4000", firmware: "v3.0.2", onlineTime: "2026-01-16 08:32:00", lastMaintenance: "2025-12-28" },
                    { id: "DEV-1008", name: "门禁视频一体机001", type: "access", ip: "192.168.1.108", status: "online", location: "8号通道", model: "Access-Video-6000", firmware: "v2.5.1", onlineTime: "2026-01-16 08:38:00", lastMaintenance: "2026-01-05" },
                    { id: "DEV-1009", name: "人证对比001", type: "access", ip: "192.168.1.109", status: "online", location: "9号通道", model: "Face-Compare-7000", firmware: "v4.0.0", onlineTime: "2026-01-16 08:42:00", lastMaintenance: "2026-01-10" },
                    { id: "DEV-1010", name: "炸探001", type: "detection", ip: "192.168.1.110", status: "online", location: "10号通道", model: "Explosive-Detector-8000", firmware: "v1.8.5", onlineTime: "2026-01-16 08:48:00", lastMaintenance: "2025-12-24" },
                    { id: "DEV-1011", name: "液探001", type: "detection", ip: "192.168.1.111", status: "online", location: "11号通道", model: "Liquid-Detector-9000", firmware: "v1.9.2", onlineTime: "2026-01-16 08:52:00", lastMaintenance: "2025-12-26" }
                ];

                // 设备状态映射
                const deviceStatusMap = {
                    online: { name: "在线", class: "status-normal" },
                    offline: { name: "离线", class: "status-danger" },
                    warning: { name: "警告", class: "status-warning" }
                };

                // 设备类型映射
                const deviceTypeMap = {
                    security: "安检设备",
                    access: "门禁设备",
                    detection: "探测设备"
                };

                // 为设备添加状态和类型名称
                return devices.map(device => ({
                    ...device,
                    statusInfo: deviceStatusMap[device.status],
                    typeName: deviceTypeMap[device.type]
                }));
            }

            // 更新时间显示
            function updateTime() {
                const now = new Date();
                const timeDisplay = document.getElementById('currentTime');
                if (timeDisplay) {
                    timeDisplay.textContent = now.toLocaleString();
                }
            }

            // 渲染设备列表
            function renderDevices(devices) {
                const tbody = document.getElementById('devicesTableBody');
                if (!tbody) return;

                tbody.innerHTML = '';

                devices.forEach(device => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                    <td>${device.id}</td>
                    <td>${device.name}</td>
                    <td>${device.typeName}</td>
                    <td>${device.ip}</td>
                    <td><span class="status-tag ${device.statusInfo.class}">${device.statusInfo.name}</span></td>
                    <td>${device.location}</td>
                    <td>
                        <button class="btn btn-primary" onclick="viewDeviceDetail('${device.id}')">详情</button>
                        <button class="btn btn-secondary" onclick="configureDevice('${device.id}')">配置</button>
                    </td>
                `;
                    tbody.appendChild(row);
                });
            }

            // 查看设备详情
            function viewDeviceDetail(deviceId) {
                const devices = window.devicesData;
                const device = devices.find(d => d.id === deviceId);
                if (!device) return;

                const detailPanel = document.getElementById('deviceDetailPanel');
                const detailContent = document.getElementById('deviceDetailContent');

                if (!detailPanel || !detailContent) return;

                // 渲染设备详情
                detailContent.innerHTML = `
                <div class="detail-panel">
                    <h4 style="margin-bottom: 15px; color: #409eff;">基本信息</h4>
                    <div class="detail-item">
                        <span class="detail-label">设备ID</span>
                        <span class="detail-value">${device.id}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">设备名称</span>
                        <span class="detail-value">${device.name}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">设备类型</span>
                        <span class="detail-value">${device.typeName}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">IP地址</span>
                        <span class="detail-value">${device.ip}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">状态</span>
                        <span class="detail-value"><span class="status-tag ${device.statusInfo.class}">${device.statusInfo.name}</span></span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">位置</span>
                        <span class="detail-value">${device.location}</span>
                    </div>
                </div>
                <div class="detail-panel">
                    <h4 style="margin-bottom: 15px; color: #409eff;">详细信息</h4>
                    <div class="detail-item">
                        <span class="detail-label">型号</span>
                        <span class="detail-value">${device.model}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">固件版本</span>
                        <span class="detail-value">${device.firmware}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">在线时间</span>
                        <span class="detail-value">${device.onlineTime}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">上次维护</span>
                        <span class="detail-value">${device.lastMaintenance}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">下次维护</span>
                        <span class="detail-value">${new Date(new Date(device.lastMaintenance).getTime() + 90 * 24 * 60 * 60 * 1000).toLocaleDateString()}</span>
                    </div>
                </div>
            `;

                // 显示详情面板
                detailPanel.style.display = 'block';
                detailPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            // 配置设备
            function configureDevice(deviceId) {
                alert(`配置设备：${deviceId}`);
                // 这里可以实现配置设备的逻辑
            }

            // 分页变量
            window.devicesCurrentPage = 1;
            window.devicesPageSize = 20;
            window.devicesTotalPages = 1;
            window.filteredDevices = [];

            // 计算设备总页数
            function calculateDevicesTotalPages() {
                window.devicesTotalPages = Math.ceil(window.filteredDevices.length / window.devicesPageSize);
                if (window.devicesTotalPages < 1) {
                    window.devicesTotalPages = 1;
                }
            }

            // 渲染分页设备列表
            function renderPagedDevices() {
                const startIndex = (window.devicesCurrentPage - 1) * window.devicesPageSize;
                const endIndex = startIndex + window.devicesPageSize;
                const pagedData = window.filteredDevices.slice(startIndex, endIndex);

                renderDevices(pagedData);
            }

            // 更新分页UI
            function updateDevicesPaginationUI() {
                document.getElementById('devicesCurrentPageSpan').textContent = window.devicesCurrentPage;
                document.getElementById('devicesTotalPagesSpan').textContent = window.devicesTotalPages;

                // 更新按钮状态
                document.getElementById('devicesFirstPageBtn').disabled = window.devicesCurrentPage === 1;
                document.getElementById('devicesPrevPageBtn').disabled = window.devicesCurrentPage === 1;
                document.getElementById('devicesNextPageBtn').disabled = window.devicesCurrentPage === window.devicesTotalPages;
                document.getElementById('devicesLastPageBtn').disabled = window.devicesCurrentPage === window.devicesTotalPages;
            }

            // 跳转到指定设备页码
            function goToDevicesPage(pageNumber) {
                if (pageNumber < 1 || pageNumber > window.devicesTotalPages) {
                    return;
                }

                window.devicesCurrentPage = pageNumber;
                renderPagedDevices();
                updateDevicesPaginationUI();
            }

            // 改变每页显示数量
            function changeDevicesPageSize() {
                const selectElement = document.getElementById('devicesPageSizeSelect');
                window.devicesPageSize = parseInt(selectElement.value);
                window.devicesCurrentPage = 1;

                calculateDevicesTotalPages();
                renderPagedDevices();
                updateDevicesPaginationUI();
            }

            // 设置分类筛选
            function setupCategoryFilter() {
                const categoryBtns = document.querySelectorAll('.category-btn');

                categoryBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        // 更新按钮状态
                        categoryBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');

                        // 获取选中的分类
                        const category = btn.dataset.category;

                        // 筛选设备
                        window.filteredDevices = category === 'all'
                            ? [...window.devicesData]
                            : window.devicesData.filter(device => device.type === category);

                        // 重置页码并重新计算总页数
                        window.devicesCurrentPage = 1;
                        calculateDevicesTotalPages();

                        // 重新渲染设备列表
                        renderPagedDevices();
                        updateDevicesPaginationUI();
                    });
                });
            }

            // 页面加载完成后初始化
            document.addEventListener('DOMContentLoaded', () => {
                // 生成并渲染数据
                const devices = generateMockData();
                window.devicesData = devices;
                window.filteredDevices = [...devices];

                // 初始化分页
                calculateDevicesTotalPages();
                renderPagedDevices();
                updateDevicesPaginationUI();

                // 设置分类筛选
                setupCategoryFilter();
            });
        </script>
    </div>
</body>

</html>
